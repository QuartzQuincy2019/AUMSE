window.__FE_PAGE__ = {"file":"fe-02.html","num":"FE-02","title":"HTML 常用标签","star":false,"body":"<p><span class=\"lang html\">HTML<\/span><\/p>\n\n<div class=\"card note\">\n  <div class=\"card-t\">这一篇讲什么<\/div>\n  <p>HTML 有 100 多个标签，但<b>日常真正用到的只有二十来个<\/b>。\n  这一篇把它们一次讲完，每个都配「写什么 → 看到什么」。<\/p>\n  <p>建议边看边在浏览器里试 —— <b>HTML 的学习成本极低，改一下刷新就见效。<\/b><\/p>\n<\/div>\n\n<h2 id=\"s1\"><span class=\"n\">1<\/span>标签地图<\/h2>\n\n<table>\n<thead><tr><th style=\"width:20%\">分类<\/th><th>标签<\/th><\/tr><\/thead>\n<tbody>\n<tr><td><b>文字<\/b><\/td>\n    <td class=\"c\">p　i　em　strong　b　span　br　hr<\/td><\/tr>\n<tr><td><b>标题<\/b><\/td>\n    <td class=\"c\">h1　h2　h3　h4　h5　h6<\/td><\/tr>\n<tr><td><b>列表<\/b><\/td>\n    <td class=\"c\">ul　ol　li<\/td><\/tr>\n<tr><td><b>分块<\/b><\/td>\n    <td class=\"c\">div　span<\/td><\/tr>\n<tr><td><b>链接与图<\/b><\/td>\n    <td class=\"c\">a　img<\/td><\/tr>\n<tr><td><b>表格<\/b><\/td>\n    <td class=\"c\">table　tr　th　td　thead　tbody<\/td><\/tr>\n<tr><td><b>表单<\/b><\/td>\n    <td class=\"c\">form　input　label　textarea　select　option　button<\/td><\/tr>\n<\/tbody>\n<\/table>\n\n<div class=\"card key\">\n  <div class=\"card-t\">先记住一个区分：块级 vs 行内<\/div>\n  <table style=\"margin:8px 0 0\">\n  <thead><tr><th style=\"width:20%\"><\/th><th>表现<\/th><th>例子<\/th><\/tr><\/thead>\n  <tbody>\n  <tr><td><b>块级<\/b><\/td><td><b>独占一行<\/b>，前后自动换行<\/td>\n      <td class=\"c\">p　div　h1　ul　table<\/td><\/tr>\n  <tr><td><b>行内<\/b><\/td><td><b>跟着文字走<\/b>，不换行<\/td>\n      <td class=\"c\">span　a　strong　i　img<\/td><\/tr>\n  <\/tbody><\/table>\n  <p style=\"margin-top:10px\">这个区分在 <b>FE-04<\/b> 讲 Display 时会再遇到，\n  是 CSS 布局的地基。<\/p>\n<\/div>\n\n<h2 id=\"s2\"><span class=\"n\">2<\/span>文字：p / i / strong / span<\/h2>\n\n<div class=\"code-wrap\"><div class=\"bar\"><span class=\"dot r\"><\/span><span class=\"dot y\"><\/span><span class=\"dot g\"><\/span><span class=\"name\">四种文字标签<\/span><span class=\"cp\">复制<\/span><\/div><pre><span class=\"hl-p\">&lt;p&gt;<\/span>普通段落。<span class=\"hl-p\">&lt;/p&gt;<\/span>\n\n<span class=\"hl-p\">&lt;p&gt;<\/span>这段里 <span class=\"hl-p\">&lt;i&gt;<\/span>倾斜<span class=\"hl-p\">&lt;/i&gt;<\/span>\n   和 <span class=\"hl-p\">&lt;strong&gt;<\/span>加粗<span class=\"hl-p\">&lt;/strong&gt;<\/span>\n   还有 <span class=\"hl-p\">&lt;span&gt;<\/span>一个行内小块<span class=\"hl-p\">&lt;/span&gt;<\/span>。<span class=\"hl-p\">&lt;/p&gt;<\/span><\/pre><\/div>\n\n<div class=\"out-wrap\"><div class=\"cap\">浏览器里看到<\/div><pre>普通段落。\n\n这段里 倾斜 和 加粗 还有 一个行内小块 。<\/pre><\/div>\n\n<table>\n<thead><tr><th style=\"width:22%\">标签<\/th><th style=\"width:22%\">效果<\/th><th>说明<\/th><\/tr><\/thead>\n<tbody>\n<tr><td class=\"c\">&lt;p&gt;<\/td><td>段落<\/td>\n    <td>块级，前后有间距。<b>正文都用它<\/b><\/td><\/tr>\n<tr><td class=\"c\">&lt;i&gt;<\/td><td><i>斜体<\/i><\/td>\n    <td>行内。<code>i<\/code> = italic<\/td><\/tr>\n<tr><td class=\"c\">&lt;em&gt;<\/td><td><i>斜体<\/i><\/td>\n    <td>和 <code>i<\/code> 长得一样，但语义是「<b>强调<\/b>」<\/td><\/tr>\n<tr><td class=\"c\">&lt;strong&gt;<\/td><td><b>加粗<\/b><\/td>\n    <td>行内。语义是「<b>重要<\/b>」<\/td><\/tr>\n<tr><td class=\"c\">&lt;b&gt;<\/td><td><b>加粗<\/b><\/td>\n    <td>和 <code>strong<\/code> 长得一样，但只是「样式上粗」，无语义<\/td><\/tr>\n<tr><td class=\"c\">&lt;span&gt;<\/td><td>没有默认效果<\/td>\n    <td><b>纯容器<\/b>。它存在的唯一目的是「给一小段文字套个壳，\n      好让 CSS 选中它」<\/td><\/tr>\n<tr><td class=\"c\">&lt;br&gt;<\/td><td>换行<\/td><td>自闭合<\/td><\/tr>\n<tr><td class=\"c\">&lt;hr&gt;<\/td><td>一条横线<\/td><td>自闭合，表示「分隔」<\/td><\/tr>\n<\/tbody>\n<\/table>\n\n<div class=\"card tip\">\n  <div class=\"card-t\"><code>i<\/code> / <code>b<\/code> 和 <code>em<\/code> / <code>strong<\/code> 该用哪个<\/div>\n  <p>长得一样，区别在<b>语义<\/b>：\n  <code>em<\/code> 是「这里要重读」，<code>strong<\/code> 是「这里很重要」。<\/p>\n  <p>屏幕阅读器（盲人用的）会<b>把 strong 读得重一些<\/b>。\n  搜索引擎也拿它判断重点。<\/p>\n  <p><b>实用建议<\/b>：正文里要加粗就用 <code>&lt;strong&gt;<\/code>，\n  要倾斜就用 <code>&lt;em&gt;<\/code>。\n  只有「纯粹想让它斜/粗，没有语义」时才用 <code>i<\/code> / <code>b<\/code>。<\/p>\n<\/div>\n\n<div class=\"card key\">\n  <div class=\"card-t\"><code>&lt;span&gt;<\/code> 是前端最常用的标签之一<\/div>\n  <p>它<b>自己不产生任何视觉效果<\/b> —— 这正是它的价值。<\/p>\n  <p>比如一句话里想让某个词变红：<\/p>\n  <div class=\"code-wrap\" style=\"margin-top:10px\"><div class=\"bar\"><span class=\"dot r\"><\/span><span class=\"dot y\"><\/span><span class=\"dot g\"><\/span><span class=\"name\">span 的典型用法<\/span><span class=\"cp\">复制<\/span><\/div><pre><span class=\"hl-p\">&lt;p&gt;<\/span>状态：<span class=\"hl-p\">&lt;span<\/span> <span class=\"hl-f\">class<\/span>=<span class=\"hl-s\">\"err\"<\/span><span class=\"hl-p\">&gt;<\/span>失败<span class=\"hl-p\">&lt;/span&gt;&lt;/p&gt;<\/span>\n\n<span class=\"hl-c\">/* 配 CSS */<\/span>\n.err { color: red; }<\/pre><\/div>\n  <p style=\"margin-top:10px\">如果不用 span，就只能给整个 <code>&lt;p&gt;<\/code> 上色了 ——\n  那就全红了。<\/p>\n<\/div>\n\n<h4>标题标签 h1~h6<\/h4>\n<div class=\"code-wrap\"><div class=\"bar\"><span class=\"dot r\"><\/span><span class=\"dot y\"><\/span><span class=\"dot g\"><\/span><span class=\"name\">六级标题<\/span><span class=\"cp\">复制<\/span><\/div><pre><span class=\"hl-p\">&lt;h1&gt;<\/span>一级标题<span class=\"hl-p\">&lt;/h1&gt;<\/span>\n<span class=\"hl-p\">&lt;h2&gt;<\/span>二级标题<span class=\"hl-p\">&lt;/h2&gt;<\/span>\n<span class=\"hl-p\">&lt;h3&gt;<\/span>三级标题<span class=\"hl-p\">&lt;/h3&gt;<\/span>\n<span class=\"hl-p\">&lt;h4&gt;<\/span>四级标题<span class=\"hl-p\">&lt;/h4&gt;<\/span>\n<span class=\"hl-p\">&lt;h5&gt;<\/span>五级标题<span class=\"hl-p\">&lt;/h5&gt;<\/span>\n<span class=\"hl-p\">&lt;h6&gt;<\/span>六级标题<span class=\"hl-p\">&lt;/h6&gt;<\/span><\/pre><\/div>\n\n<p>它们默认<b>又大又粗、独占一行<\/b>。\n注意 <code>h1<\/code> <b>一页最好只用一个<\/b>（页面主标题），\n其余按层级往下用 —— <b>不要为了「字大」而用 h，那是 CSS 的活。<\/b><\/p>\n\n<h2 id=\"s3\"><span class=\"n\">3<\/span>列表：ul / ol / li<\/h2>\n\n<div class=\"code-wrap\"><div class=\"bar\"><span class=\"dot r\"><\/span><span class=\"dot y\"><\/span><span class=\"dot g\"><\/span><span class=\"name\">两种列表<\/span><span class=\"cp\">复制<\/span><\/div><pre><span class=\"hl-c\">&lt;!-- ul = unordered list，无序列表（圆点） --&gt;<\/span>\n<span class=\"hl-p\">&lt;ul&gt;<\/span>\n  <span class=\"hl-p\">&lt;li&gt;<\/span>苹果<span class=\"hl-p\">&lt;/li&gt;<\/span>\n  <span class=\"hl-p\">&lt;li&gt;<\/span>香蕉<span class=\"hl-p\">&lt;/li&gt;<\/span>\n  <span class=\"hl-p\">&lt;li&gt;<\/span>樱桃<span class=\"hl-p\">&lt;/li&gt;<\/span>\n<span class=\"hl-p\">&lt;/ul&gt;<\/span>\n\n<span class=\"hl-c\">&lt;!-- ol = ordered list，有序列表（数字） --&gt;<\/span>\n<span class=\"hl-p\">&lt;ol&gt;<\/span>\n  <span class=\"hl-p\">&lt;li&gt;<\/span>第一步<span class=\"hl-p\">&lt;/li&gt;<\/span>\n  <span class=\"hl-p\">&lt;li&gt;<\/span>第二步<span class=\"hl-p\">&lt;/li&gt;<\/span>\n  <span class=\"hl-p\">&lt;li&gt;<\/span>第三步<span class=\"hl-p\">&lt;/li&gt;<\/span>\n<span class=\"hl-p\">&lt;/ol&gt;<\/span><\/pre><\/div>\n\n<div class=\"out-wrap\"><div class=\"cap\">浏览器里看到<\/div><pre>• 苹果\n• 香蕉\n• 樱桃\n\n1. 第一步\n2. 第二步\n3. 第三步<\/pre><\/div>\n\n<div class=\"card warn\">\n  <div class=\"card-t\">结构不能乱：<code>li<\/code> 必须在 <code>ul<\/code>/<code>ol<\/code> 里面<\/div>\n  <div class=\"code-wrap\" style=\"margin-top:10px\"><div class=\"bar\"><span class=\"dot r\"><\/span><span class=\"dot y\"><\/span><span class=\"dot g\"><\/span><span class=\"name\">对比<\/span><span class=\"cp\">复制<\/span><\/div><pre><span class=\"hl-p\">&lt;ul&gt;<\/span>\n  <span class=\"hl-p\">&lt;li&gt;<\/span>苹果<span class=\"hl-p\">&lt;/li&gt;<\/span>\n<span class=\"hl-p\">&lt;/ul&gt;<\/span>\n<span class=\"hl-p\">&lt;li&gt;<\/span>香蕉<span class=\"hl-p\">&lt;/li&gt;<\/span>     <span class=\"hl-c\">&lt;!-- ❌ 落单的 li，浏览器会自己瞎补 --&gt;<\/span>\n\n<span class=\"hl-p\">&lt;li&gt;<\/span>苹果<span class=\"hl-p\">&lt;/li&gt;<\/span>        <span class=\"hl-c\">&lt;!-- ❌ ul 不能直接放文字 --&gt;<\/span><\/pre><\/div>\n  <p style=\"margin-top:10px\">规则：<b><code>ul<\/code> / <code>ol<\/code> 的直接子元素只能是 <code>li<\/code><\/b>。\n  列表就是「列表项」的容器。<\/p>\n<\/div>\n\n<p>列表可以嵌套（子列表放在某个 <code>li<\/code> 里面）：<\/p>\n<div class=\"code-wrap\"><div class=\"bar\"><span class=\"dot r\"><\/span><span class=\"dot y\"><\/span><span class=\"dot g\"><\/span><span class=\"name\">嵌套列表<\/span><span class=\"cp\">复制<\/span><\/div><pre><span class=\"hl-p\">&lt;ul&gt;<\/span>\n  <span class=\"hl-p\">&lt;li&gt;<\/span>前端\n    <span class=\"hl-p\">&lt;ul&gt;<\/span>\n      <span class=\"hl-p\">&lt;li&gt;<\/span>HTML<span class=\"hl-p\">&lt;/li&gt;<\/span>\n      <span class=\"hl-p\">&lt;li&gt;<\/span>CSS<span class=\"hl-p\">&lt;/li&gt;<\/span>\n    <span class=\"hl-p\">&lt;/ul&gt;<\/span>\n  <span class=\"hl-p\">&lt;/li&gt;<\/span>\n  <span class=\"hl-p\">&lt;li&gt;<\/span>后端<span class=\"hl-p\">&lt;/li&gt;<\/span>\n<span class=\"hl-p\">&lt;/ul&gt;<\/span><\/pre><\/div>\n\n<div class=\"card tip\">\n  <div class=\"card-t\">导航菜单为什么用 ul<\/div>\n  <p>因为「一堆链接」本质上<b>就是一个列表<\/b>。\n  语义正确 + 浏览器和阅读器都懂 + CSS 好写。<\/p>\n  <p><b>本系列文档左边的目录就是用 <code>&lt;ul&gt;<\/code> 做的<\/b>\n  （你按 F12 看得到）。<\/p>\n<\/div>\n\n<h2 id=\"s4\"><span class=\"n\">4<\/span>分块：div<\/h2>\n\n<p><code>&lt;div&gt;<\/code> 是「<b>块级容器<\/b>」—— 和 <code>span<\/code> 是一对：<\/p>\n\n<table>\n<thead><tr><th style=\"width:22%\"><\/th><th>类型<\/th><th>用途<\/th><\/tr><\/thead>\n<tbody>\n<tr><td class=\"c\">&lt;div&gt;<\/td><td>块级容器<\/td><td><b>把一大块内容圈起来<\/b>，好整体排版<\/td><\/tr>\n<tr><td class=\"c\">&lt;span&gt;<\/td><td>行内容器<\/td><td><b>把一小段文字圈起来<\/b>，好单独上色<\/td><\/tr>\n<\/tbody>\n<\/table>\n\n<div class=\"code-wrap\"><div class=\"bar\"><span class=\"dot r\"><\/span><span class=\"dot y\"><\/span><span class=\"dot g\"><\/span><span class=\"name\">div 把内容分组<\/span><span class=\"cp\">复制<\/span><\/div><pre><span class=\"hl-p\">&lt;div<\/span> <span class=\"hl-f\">class<\/span>=<span class=\"hl-s\">\"card\"<\/span><span class=\"hl-p\">&gt;<\/span>\n  <span class=\"hl-p\">&lt;h3&gt;<\/span>卡片标题<span class=\"hl-p\">&lt;/h3&gt;<\/span>\n  <span class=\"hl-p\">&lt;p&gt;<\/span>卡片内容。<span class=\"hl-p\">&lt;/p&gt;<\/span>\n<span class=\"hl-p\">&lt;/div&gt;<\/span>\n\n<span class=\"hl-p\">&lt;div<\/span> <span class=\"hl-f\">class<\/span>=<span class=\"hl-s\">\"card\"<\/span><span class=\"hl-p\">&gt;<\/span>\n  <span class=\"hl-p\">&lt;h3&gt;<\/span>另一张卡片<span class=\"hl-p\">&lt;/h3&gt;<\/span>\n  <span class=\"hl-p\">&lt;p&gt;<\/span>另一段内容。<span class=\"hl-p\">&lt;/p&gt;<\/span>\n<span class=\"hl-p\">&lt;/div&gt;<\/span><\/pre><\/div>\n\n<div class=\"card key\">\n  <div class=\"card-t\">div 自己什么效果都没有<\/div>\n  <p>它不加粗、不上色、不缩进 —— <b>它就是个透明的盒子<\/b>。<\/p>\n  <p>它的全部意义是「<b>给 CSS 一个可以选中的范围<\/b>」。\n  所以 div 几乎<b>总是配着 <code>class<\/code> 出现<\/b>。<\/p>\n  <p>本文档里的每一张卡片、每一个提示框，背后都是一个 <code>div<\/code>。<\/p>\n<\/div>\n\n<div class=\"card warn\">\n  <div class=\"card-t\">别用 div 堆出一个假表格<\/div>\n  <p>新手有时用一堆 div 加边框做出表格的样子。\n  <b>如果内容真的是表格，就用 <code>&lt;table&gt;<\/code><\/b> ——\n  语义正确、屏幕阅读器能读、还对打印友好。<\/p>\n  <p>判断标准：<b>「这些数据有行和列的关系吗？」<\/b>有就用 table。<\/p>\n<\/div>\n\n<h2 id=\"s5\"><span class=\"n\">5<\/span>链接：a 与 href<\/h2>\n\n<div class=\"code-wrap\"><div class=\"bar\"><span class=\"dot r\"><\/span><span class=\"dot y\"><\/span><span class=\"dot g\"><\/span><span class=\"name\">最基本的链接<\/span><span class=\"cp\">复制<\/span><\/div><pre><span class=\"hl-p\">&lt;a<\/span> <span class=\"hl-f\">href<\/span>=<span class=\"hl-s\">\"https://example.com\"<\/span><span class=\"hl-p\">&gt;<\/span>点我去 example<span class=\"hl-p\">&lt;/a&gt;<\/span><\/pre><\/div>\n\n<div class=\"out-wrap\"><div class=\"cap\">浏览器里看到（蓝色带下划线，可点）<\/div><pre>点我去 example<\/pre><\/div>\n\n<p><code>a<\/code> = <b>anchor<\/b>（锚），<code>href<\/code> = <b>h<\/b>ypertext <b>ref<\/b>erence。\n<b><code>href<\/code> 是 <code>a<\/code> 最重要的属性<\/b> —— 没有它，链接就没目标。<\/p>\n\n<h4><code>href<\/code> 能写什么<\/h4>\n<table>\n<thead><tr><th style=\"width:34%\">写法<\/th><th>去哪里<\/th><\/tr><\/thead>\n<tbody>\n<tr><td class=\"c\">https://example.com<\/td>\n    <td><b>完整网址<\/b>（绝对地址），去别的网站<\/td><\/tr>\n<tr><td class=\"c\">page2.html<\/td>\n    <td><b>同目录<\/b>下的另一个文件<\/td><\/tr>\n<tr><td class=\"c\">sub/page2.html<\/td><td>子目录里的文件<\/td><\/tr>\n<tr><td class=\"c\">../index.html<\/td><td>上一级目录（<code>..<\/code> 和文件系统一样）<\/td><\/tr>\n<tr><td class=\"c\">#s3<\/td>\n    <td><b>跳到本页的某个位置<\/b> —— 那个元素的 <code>id<\/code><\/td><\/tr>\n<tr><td class=\"c\">#<\/td><td>回到页面顶部（空的锚点）<\/td><\/tr>\n<tr><td class=\"c\">mailto:a@b.com<\/td><td>打开邮件客户端<\/td><\/tr>\n<\/tbody>\n<\/table>\n\n<div class=\"card tip\">\n  <div class=\"card-t\"><code>#锚点<\/code> 就是「目录跳转」的原理<\/div>\n  <p>本文档左边的目录，每一条都是 <code>&lt;a href=\"#s3\"&gt;<\/code>，\n  而正文里对应的小节写着 <code>&lt;h2 id=\"s3\"&gt;<\/code>。\n  点目录 → 跳到那个 id。<\/p>\n  <p><b>只需 id 对得上，不需要任何 JavaScript。<\/b><\/p>\n<\/div>\n\n<h4>在新标签页打开<\/h4>\n<div class=\"code-wrap\"><div class=\"bar\"><span class=\"dot r\"><\/span><span class=\"dot y\"><\/span><span class=\"dot g\"><\/span><span class=\"name\">target 属性<\/span><span class=\"cp\">复制<\/span><\/div><pre><span class=\"hl-p\">&lt;a<\/span> <span class=\"hl-f\">href<\/span>=<span class=\"hl-s\">\"https://example.com\"<\/span> <span class=\"hl-f\">target<\/span>=<span class=\"hl-s\">\"_blank\"<\/span><span class=\"hl-p\">&gt;<\/span>新标签页打开<span class=\"hl-p\">&lt;/a&gt;<\/span><\/pre><\/div>\n\n<table>\n<thead><tr><th style=\"width:26%\">target 的值<\/th><th>行为<\/th><\/tr><\/thead>\n<tbody>\n<tr><td class=\"c\">（不写）<\/td><td>当前标签页打开<\/td><\/tr>\n<tr><td class=\"c\">_blank<\/td><td><b>新标签页<\/b>打开<\/td><\/tr>\n<tr><td class=\"c\">_self<\/td><td>当前页（默认）<\/td><\/tr>\n<\/tbody>\n<\/table>\n\n<div class=\"card warn\">\n  <div class=\"card-t\">别滥用 <code>target=\"_blank\"<\/code><\/div>\n  <p>每点一个链接就多一个标签页，用户很快会烦。\n  只有<b>「跳到站外、不希望用户离开本站」<\/b>时才用。<\/p>\n  <p>另外：用 <code>_blank<\/code> 打开外部网站时，\n  那个页面能拿到你页面的控制权（<code>window.opener<\/code>）。\n  加一句 <code>rel=\"noopener\"<\/code> 更安全：<\/p>\n  <div class=\"code-wrap\" style=\"margin-top:10px\"><div class=\"bar\"><span class=\"dot r\"><\/span><span class=\"dot y\"><\/span><span class=\"dot g\"><\/span><span class=\"name\">推荐写法<\/span><span class=\"cp\">复制<\/span><\/div><pre><span class=\"hl-p\">&lt;a<\/span> <span class=\"hl-f\">href<\/span>=<span class=\"hl-s\">\"https://example.com\"<\/span>\n   <span class=\"hl-f\">target<\/span>=<span class=\"hl-s\">\"_blank\"<\/span> <span class=\"hl-f\">rel<\/span>=<span class=\"hl-s\">\"noopener\"<\/span><span class=\"hl-p\">&gt;<\/span>站外链接<span class=\"hl-p\">&lt;/a&gt;<\/span><\/pre><\/div>\n<\/div>\n\n<h2 id=\"s6\"><span class=\"n\">6<\/span>表格：table 系列<\/h2>\n\n<div class=\"code-wrap\"><div class=\"bar\"><span class=\"dot r\"><\/span><span class=\"dot y\"><\/span><span class=\"dot g\"><\/span><span class=\"name\">一个完整表格<\/span><span class=\"cp\">复制<\/span><\/div><pre><span class=\"hl-p\">&lt;table&gt;<\/span>\n  <span class=\"hl-p\">&lt;thead&gt;<\/span>                     <span class=\"hl-c\">&lt;!-- 表头区 --&gt;<\/span>\n    <span class=\"hl-p\">&lt;tr&gt;<\/span>                      <span class=\"hl-c\">&lt;!-- 一行 --&gt;<\/span>\n      <span class=\"hl-p\">&lt;th&gt;<\/span>名字<span class=\"hl-p\">&lt;/th&gt;<\/span>            <span class=\"hl-c\">&lt;!-- 表头格 --&gt;<\/span>\n      <span class=\"hl-p\">&lt;th&gt;<\/span>血量<span class=\"hl-p\">&lt;/th&gt;<\/span>\n    <span class=\"hl-p\">&lt;/tr&gt;<\/span>\n  <span class=\"hl-p\">&lt;/thead&gt;<\/span>\n  <span class=\"hl-p\">&lt;tbody&gt;<\/span>                     <span class=\"hl-c\">&lt;!-- 数据区 --&gt;<\/span>\n    <span class=\"hl-p\">&lt;tr&gt;<\/span>\n      <span class=\"hl-p\">&lt;td&gt;<\/span>Archer<span class=\"hl-p\">&lt;/td&gt;<\/span>          <span class=\"hl-c\">&lt;!-- 数据格 --&gt;<\/span>\n      <span class=\"hl-p\">&lt;td&gt;<\/span>100<span class=\"hl-p\">&lt;/td&gt;<\/span>\n    <span class=\"hl-p\">&lt;/tr&gt;<\/span>\n    <span class=\"hl-p\">&lt;tr&gt;<\/span>\n      <span class=\"hl-p\">&lt;td&gt;<\/span>Mage<span class=\"hl-p\">&lt;/td&gt;<\/span>\n      <span class=\"hl-p\">&lt;td&gt;<\/span>80<span class=\"hl-p\">&lt;/td&gt;<\/span>\n    <span class=\"hl-p\">&lt;/tr&gt;<\/span>\n  <span class=\"hl-p\">&lt;/tbody&gt;<\/span>\n<span class=\"hl-p\">&lt;/table&gt;<\/span><\/pre><\/div>\n\n<table>\n<thead><tr><th style=\"width:22%\">标签<\/th><th>含义<\/th><th style=\"width:26%\">记忆<\/th><\/tr><\/thead>\n<tbody>\n<tr><td class=\"c\">table<\/td><td>整张表<\/td><td>table<\/td><\/tr>\n<tr><td class=\"c\">tr<\/td><td><b>t<\/b>able <b>r<\/b>ow，一行<\/td><td>行<\/td><\/tr>\n<tr><td class=\"c\">th<\/td><td><b>t<\/b>able <b>h<\/b>eader，表头格<\/td><td><b>粗体居中<\/b><\/td><\/tr>\n<tr><td class=\"c\">td<\/td><td><b>t<\/b>able <b>d<\/b>ata，数据格<\/td><td>普通格<\/td><\/tr>\n<tr><td class=\"c\">thead<\/td><td>表头区（放 <code>tr<\/code>）<\/td><td>可选但推荐<\/td><\/tr>\n<tr><td class=\"c\">tbody<\/td><td>数据区（放 <code>tr<\/code>）<\/td><td>可选但推荐<\/td><\/tr>\n<\/tbody>\n<\/table>\n\n<div class=\"card key\">\n  <div class=\"card-t\">结构规则：一层套一层<\/div>\n  <pre style=\"background:#0b1220;border:1px solid #33486b;border-radius:8px;padding:10px 12px;font-family:var(--mono);font-size:12.5px;color:#f8fbff;overflow:auto\">table\n └─ tr          ← 行只能放在 table / thead / tbody 里\n     └─ td / th ← 格子只能放在 tr 里<\/pre>\n  <p style=\"margin-top:10px\"><b>不能跳级<\/b>：<code>table<\/code> 里直接写 <code>td<\/code> 是错的，\n  <code>tr<\/code> 里直接写文字也是错的。<\/p>\n<\/div>\n\n<h4>合并单元格：colspan 与 rowspan<\/h4>\n<div class=\"code-wrap\"><div class=\"bar\"><span class=\"dot r\"><\/span><span class=\"dot y\"><\/span><span class=\"dot g\"><\/span><span class=\"name\">跨列与跨行<\/span><span class=\"cp\">复制<\/span><\/div><pre><span class=\"hl-p\">&lt;table&gt;<\/span>\n  <span class=\"hl-p\">&lt;tr&gt;<\/span>\n    <span class=\"hl-p\">&lt;th<\/span> <span class=\"hl-f\">colspan<\/span>=<span class=\"hl-s\">\"2\"<\/span><span class=\"hl-p\">&gt;<\/span>横跨两列<span class=\"hl-p\">&lt;/th&gt;<\/span>   <span class=\"hl-c\">&lt;!-- col = column --&gt;<\/span>\n  <span class=\"hl-p\">&lt;/tr&gt;<\/span>\n  <span class=\"hl-p\">&lt;tr&gt;<\/span>\n    <span class=\"hl-p\">&lt;td<\/span> <span class=\"hl-f\">rowspan<\/span>=<span class=\"hl-s\">\"2\"<\/span><span class=\"hl-p\">&gt;<\/span>竖跨两行<span class=\"hl-p\">&lt;/td&gt;<\/span>   <span class=\"hl-c\">&lt;!-- row = 行 --&gt;<\/span>\n    <span class=\"hl-p\">&lt;td&gt;<\/span>A<span class=\"hl-p\">&lt;/td&gt;<\/span>\n  <span class=\"hl-p\">&lt;/tr&gt;<\/span>\n  <span class=\"hl-p\">&lt;tr&gt;<\/span>\n    <span class=\"hl-p\">&lt;td&gt;<\/span>B<span class=\"hl-p\">&lt;/td&gt;<\/span>                  <span class=\"hl-c\">&lt;!-- 这一行少一列，因为上面占了 --&gt;<\/span>\n  <span class=\"hl-p\">&lt;/tr&gt;<\/span>\n<span class=\"hl-p\">&lt;/table&gt;<\/span><\/pre><\/div>\n\n<p><b>注意<\/b>：用了 <code>rowspan=\"2\"<\/code> 之后，下一行就要<b>少写一个 <code>td<\/code><\/b>，\n否则表格会错位。<\/p>\n\n<h2 id=\"s7\"><span class=\"n\">7<\/span>表单：form 系列<\/h2>\n\n<p>表单是「<b>让用户填东西<\/b>」的区域：登录框、搜索框、设置页都是。<\/p>\n\n<h4>input：最核心的标签<\/h4>\n<div class=\"code-wrap\"><div class=\"bar\"><span class=\"dot r\"><\/span><span class=\"dot y\"><\/span><span class=\"dot g\"><\/span><span class=\"name\">input 靠 type 变身<\/span><span class=\"cp\">复制<\/span><\/div><pre><span class=\"hl-p\">&lt;input<\/span> <span class=\"hl-f\">type<\/span>=<span class=\"hl-s\">\"text\"<\/span>     <span class=\"hl-f\">placeholder<\/span>=<span class=\"hl-s\">\"请输入名字\"<\/span><span class=\"hl-p\">&gt;<\/span>\n<span class=\"hl-p\">&lt;input<\/span> <span class=\"hl-f\">type<\/span>=<span class=\"hl-s\">\"password\"<\/span> <span class=\"hl-f\">placeholder<\/span>=<span class=\"hl-s\">\"密码\"<\/span><span class=\"hl-p\">&gt;<\/span>\n<span class=\"hl-p\">&lt;input<\/span> <span class=\"hl-f\">type<\/span>=<span class=\"hl-s\">\"number\"<\/span>   <span class=\"hl-f\">min<\/span>=<span class=\"hl-s\">\"0\"<\/span> <span class=\"hl-f\">max<\/span>=<span class=\"hl-s\">\"100\"<\/span><span class=\"hl-p\">&gt;<\/span>\n<span class=\"hl-p\">&lt;input<\/span> <span class=\"hl-f\">type<\/span>=<span class=\"hl-s\">\"checkbox\"<\/span><span class=\"hl-p\">&gt;<\/span> 记住我\n<span class=\"hl-p\">&lt;input<\/span> <span class=\"hl-f\">type<\/span>=<span class=\"hl-s\">\"radio\"<\/span> <span class=\"hl-f\">name<\/span>=<span class=\"hl-s\">\"lv\"<\/span><span class=\"hl-p\">&gt;<\/span> 简单\n<span class=\"hl-p\">&lt;input<\/span> <span class=\"hl-f\">type<\/span>=<span class=\"hl-s\">\"radio\"<\/span> <span class=\"hl-f\">name<\/span>=<span class=\"hl-s\">\"lv\"<\/span><span class=\"hl-p\">&gt;<\/span> 困难\n<span class=\"hl-p\">&lt;input<\/span> <span class=\"hl-f\">type<\/span>=<span class=\"hl-s\">\"file\"<\/span><span class=\"hl-p\">&gt;<\/span>\n<span class=\"hl-p\">&lt;input<\/span> <span class=\"hl-f\">type<\/span>=<span class=\"hl-s\">\"submit\"<\/span> <span class=\"hl-f\">value<\/span>=<span class=\"hl-s\">\"提交\"<\/span><span class=\"hl-p\">&gt;<\/span><\/pre><\/div>\n\n<table>\n<thead><tr><th style=\"width:22%\">type<\/th><th>变成什么<\/th><\/tr><\/thead>\n<tbody>\n<tr><td class=\"c\">text<\/td><td>单行文本框（默认）<\/td><\/tr>\n<tr><td class=\"c\">password<\/td><td>输入时显示成圆点<\/td><\/tr>\n<tr><td class=\"c\">number<\/td><td>只能输数字，带上下箭头<\/td><\/tr>\n<tr><td class=\"c\">checkbox<\/td><td><b>复选框<\/b>（可多选）<\/td><\/tr>\n<tr><td class=\"c\">radio<\/td><td><b>单选钮<\/b>（同 name 的互斥）<\/td><\/tr>\n<tr><td class=\"c\">file<\/td><td>选文件<\/td><\/tr>\n<tr><td class=\"c\">submit<\/td><td>提交按钮<\/td><\/tr>\n<tr><td class=\"c\">color / date / range<\/td><td>取色器 / 日期 / 滑块<\/td><\/tr>\n<\/tbody>\n<\/table>\n\n<div class=\"card key\">\n  <div class=\"card-t\"><code>radio<\/code> 靠 <code>name<\/code> 分组<\/div>\n  <p>上面那两个 radio <b>都写了 <code>name=\"lv\"<\/code><\/b> ——\n  所以它们互斥，只能选一个。<\/p>\n  <p>如果两个 radio 的 <code>name<\/code> 不同，就会<b>变成两组独立的单选<\/b>，\n  可以同时选中。这是最常见的表单坑。<\/p>\n<\/div>\n\n<h4>label：让文字也能点<\/h4>\n<div class=\"code-wrap\"><div class=\"bar\"><span class=\"dot r\"><\/span><span class=\"dot y\"><\/span><span class=\"dot g\"><\/span><span class=\"name\">两种写法<\/span><span class=\"cp\">复制<\/span><\/div><pre><span class=\"hl-c\">&lt;!-- ① 包起来 --&gt;<\/span>\n<span class=\"hl-p\">&lt;label&gt;<\/span>\n  <span class=\"hl-p\">&lt;input<\/span> <span class=\"hl-f\">type<\/span>=<span class=\"hl-s\">\"checkbox\"<\/span><span class=\"hl-p\">&gt;<\/span> 记住我\n<span class=\"hl-p\">&lt;/label&gt;<\/span>\n\n<span class=\"hl-c\">&lt;!-- ② 用 for 指向 input 的 id --&gt;<\/span>\n<span class=\"hl-p\">&lt;label<\/span> <span class=\"hl-f\">for<\/span>=<span class=\"hl-s\">\"pwd\"<\/span><span class=\"hl-p\">&gt;<\/span>密码<span class=\"hl-p\">&lt;/label&gt;<\/span>\n<span class=\"hl-p\">&lt;input<\/span> <span class=\"hl-f\">id<\/span>=<span class=\"hl-s\">\"pwd\"<\/span> <span class=\"hl-f\">type<\/span>=<span class=\"hl-s\">\"password\"<\/span><span class=\"hl-p\">&gt;<\/span><\/pre><\/div>\n\n<p>加了 label 之后，<b>点文字就等于点控件<\/b> ——\n复选框和单选钮尤其明显（不然只有那个小方块能点，很难点中）。\n<b>正式页面都应该加。<\/b><\/p>\n\n<h4>textarea / select / button<\/h4>\n<div class=\"code-wrap\"><div class=\"bar\"><span class=\"dot r\"><\/span><span class=\"dot y\"><\/span><span class=\"dot g\"><\/span><span class=\"name\">多行文本、下拉、按钮<\/span><span class=\"cp\">复制<\/span><\/div><pre><span class=\"hl-c\">&lt;!-- 多行文本框（注意：有结束标签） --&gt;<\/span>\n<span class=\"hl-p\">&lt;textarea<\/span> <span class=\"hl-f\">rows<\/span>=<span class=\"hl-s\">\"3\"<\/span> <span class=\"hl-f\">cols<\/span>=<span class=\"hl-s\">\"30\"<\/span><span class=\"hl-p\">&gt;<\/span>默认文字<span class=\"hl-p\">&lt;/textarea&gt;<\/span>\n\n<span class=\"hl-c\">&lt;!-- 下拉框 --&gt;<\/span>\n<span class=\"hl-p\">&lt;select&gt;<\/span>\n  <span class=\"hl-p\">&lt;option<\/span> <span class=\"hl-f\">value<\/span>=<span class=\"hl-s\">\"a\"<\/span><span class=\"hl-p\">&gt;<\/span>选项 A<span class=\"hl-p\">&lt;/option&gt;<\/span>\n  <span class=\"hl-p\">&lt;option<\/span> <span class=\"hl-f\">value<\/span>=<span class=\"hl-s\">\"b\"<\/span><span class=\"hl-p\">&gt;<\/span>选项 B<span class=\"hl-p\">&lt;/option&gt;<\/span>\n<span class=\"hl-p\">&lt;/select&gt;<\/span>\n\n<span class=\"hl-c\">&lt;!-- 按钮 --&gt;<\/span>\n<span class=\"hl-p\">&lt;button&gt;<\/span>点我<span class=\"hl-p\">&lt;/button&gt;<\/span><\/pre><\/div>\n\n<h4>用 form 包起来<\/h4>\n<div class=\"code-wrap\"><div class=\"bar\"><span class=\"dot r\"><\/span><span class=\"dot y\"><\/span><span class=\"dot g\"><\/span><span class=\"name\">完整的表单<\/span><span class=\"cp\">复制<\/span><\/div><pre><span class=\"hl-p\">&lt;form<\/span> <span class=\"hl-f\">action<\/span>=<span class=\"hl-s\">\"/login\"<\/span> <span class=\"hl-f\">method<\/span>=<span class=\"hl-s\">\"post\"<\/span><span class=\"hl-p\">&gt;<\/span>\n  <span class=\"hl-p\">&lt;label<\/span> <span class=\"hl-f\">for<\/span>=<span class=\"hl-s\">\"u\"<\/span><span class=\"hl-p\">&gt;<\/span>用户名<span class=\"hl-p\">&lt;/label&gt;<\/span>\n  <span class=\"hl-p\">&lt;input<\/span> <span class=\"hl-f\">id<\/span>=<span class=\"hl-s\">\"u\"<\/span> <span class=\"hl-f\">name<\/span>=<span class=\"hl-s\">\"user\"<\/span> <span class=\"hl-f\">type<\/span>=<span class=\"hl-s\">\"text\"<\/span><span class=\"hl-p\">&gt;<\/span>\n\n  <span class=\"hl-p\">&lt;label<\/span> <span class=\"hl-f\">for<\/span>=<span class=\"hl-s\">\"p\"<\/span><span class=\"hl-p\">&gt;<\/span>密码<span class=\"hl-p\">&lt;/label&gt;<\/span>\n  <span class=\"hl-p\">&lt;input<\/span> <span class=\"hl-f\">id<\/span>=<span class=\"hl-s\">\"p\"<\/span> <span class=\"hl-f\">name<\/span>=<span class=\"hl-s\">\"pwd\"<\/span> <span class=\"hl-f\">type<\/span>=<span class=\"hl-s\">\"password\"<\/span><span class=\"hl-p\">&gt;<\/span>\n\n  <span class=\"hl-p\">&lt;button<\/span> <span class=\"hl-f\">type<\/span>=<span class=\"hl-s\">\"submit\"<\/span><span class=\"hl-p\">&gt;<\/span>登录<span class=\"hl-p\">&lt;/button&gt;<\/span>\n<span class=\"hl-p\">&lt;/form&gt;<\/span><\/pre><\/div>\n\n<table>\n<thead><tr><th style=\"width:22%\">属性<\/th><th>作用<\/th><\/tr><\/thead>\n<tbody>\n<tr><td class=\"c\">action<\/td><td>提交到哪个地址<\/td><\/tr>\n<tr><td class=\"c\">method<\/td><td><code>get<\/code>（参数在网址里）/ <code>post<\/code>（在请求体里）<\/td><\/tr>\n<tr><td class=\"c\">name<\/td><td><b>提交时这一项的键名<\/b> —— 没写 name 的控件不会被提交<\/td><\/tr>\n<\/tbody>\n<\/table>\n\n<div class=\"card tip\">\n  <div class=\"card-t\">UME 的场景<\/div>\n  <p>本项目是纯前端编辑器，<b>基本不用 <code>&lt;form&gt;<\/code><\/b>\n  —— 搜索框、选字体这些用 <code>input<\/code> 就够了，\n  交互靠 JavaScript 处理，不走「提交」。<\/p>\n  <p>但桌面/网页版做「设置面板」时，\n  <code>input<\/code> + <code>label<\/code> 的组合会用得非常多。<\/p>\n<\/div>\n\n<h2 id=\"s8\"><span class=\"n\">8<\/span>全局属性：title / class / id<\/h2>\n\n<p>有三个属性<b>几乎所有标签都能写<\/b>，值得单独讲。<\/p>\n\n<h4>title：鼠标悬停时的提示<\/h4>\n<div class=\"code-wrap\"><div class=\"bar\"><span class=\"dot r\"><\/span><span class=\"dot y\"><\/span><span class=\"dot g\"><\/span><span class=\"name\">title 属性<\/span><span class=\"cp\">复制<\/span><\/div><pre><span class=\"hl-p\">&lt;span<\/span> <span class=\"hl-f\">title<\/span>=<span class=\"hl-s\">\"这里会显示提示文字\"<\/span><span class=\"hl-p\">&gt;<\/span>鼠标移上来看看<span class=\"hl-p\">&lt;/span&gt;<\/span>\n\n<span class=\"hl-p\">&lt;abbr<\/span> <span class=\"hl-f\">title<\/span>=<span class=\"hl-s\">\"HyperText Markup Language\"<\/span><span class=\"hl-p\">&gt;<\/span>HTML<span class=\"hl-p\">&lt;/abbr&gt;<\/span><\/pre><\/div>\n\n<div class=\"out-wrap\"><div class=\"cap\">行为<\/div><pre>鼠标停在文字上约 1 秒 → 浮出一个黄色小提示框\n\n手机上没有「悬停」，所以 title 在手机端通常看不到\n  → 重要信息不要只放在 title 里<\/pre><\/div>\n\n<p>本文档里就用了它 —— 比如导航页那些星号，\n鼠标移上去会显示「与本项目施行密切相关」。<\/p>\n\n<h4>class 与 id：给元素起名字<\/h4>\n<table>\n<thead><tr><th style=\"width:20%\"><\/th><th>class<\/th><th>id<\/th><\/tr><\/thead>\n<tbody>\n<tr><td><b>能不能重复<\/b><\/td>\n    <td><span class=\"tag g\">可以<\/span> 多个元素共用一个 class<\/td>\n    <td><span class=\"tag r\">不能<\/span> <b>全页唯一<\/b><\/td><\/tr>\n<tr><td><b>一个元素能有几个<\/b><\/td>\n    <td>可以写多个，空格隔开<\/td>\n    <td>只能一个<\/td><\/tr>\n<tr><td><b>主要用途<\/b><\/td>\n    <td><b>CSS 批量选中<\/b>同类元素<\/td>\n    <td><b>唯一标识<\/b>：锚点跳转、JS 精确找<\/td><\/tr>\n<tr><td><b>CSS 里怎么写<\/b><\/td><td class=\"c\">.card { }<\/td>\n    <td class=\"c\">#header { }<\/td><\/tr>\n<\/tbody>\n<\/table>\n\n<div class=\"code-wrap\"><div class=\"bar\"><span class=\"dot r\"><\/span><span class=\"dot y\"><\/span><span class=\"dot g\"><\/span><span class=\"name\">对比<\/span><span class=\"cp\">复制<\/span><\/div><pre><span class=\"hl-c\">&lt;!-- class：三个卡片共用一种样式 --&gt;<\/span>\n<span class=\"hl-p\">&lt;div<\/span> <span class=\"hl-f\">class<\/span>=<span class=\"hl-s\">\"card\"<\/span><span class=\"hl-p\">&gt;<\/span>卡片一<span class=\"hl-p\">&lt;/div&gt;<\/span>\n<span class=\"hl-p\">&lt;div<\/span> <span class=\"hl-f\">class<\/span>=<span class=\"hl-s\">\"card\"<\/span><span class=\"hl-p\">&gt;<\/span>卡片二<span class=\"hl-p\">&lt;/div&gt;<\/span>\n<span class=\"hl-p\">&lt;div<\/span> <span class=\"hl-f\">class<\/span>=<span class=\"hl-s\">\"card\"<\/span><span class=\"hl-p\">&gt;<\/span>卡片三<span class=\"hl-p\">&lt;/div&gt;<\/span>\n\n<span class=\"hl-c\">&lt;!-- 一个元素可以有多个 class --&gt;<\/span>\n<span class=\"hl-p\">&lt;div<\/span> <span class=\"hl-f\">class<\/span>=<span class=\"hl-s\">\"card highlight\"<\/span><span class=\"hl-p\">&gt;<\/span>既是卡片，又高亮<span class=\"hl-p\">&lt;/div&gt;<\/span>\n\n<span class=\"hl-c\">&lt;!-- id：唯一的锚点 --&gt;<\/span>\n<span class=\"hl-p\">&lt;h2<\/span> <span class=\"hl-f\">id<\/span>=<span class=\"hl-s\">\"install\"<\/span><span class=\"hl-p\">&gt;<\/span>安装步骤<span class=\"hl-p\">&lt;/h2&gt;<\/span>\n<span class=\"hl-p\">&lt;a<\/span> <span class=\"hl-f\">href<\/span>=<span class=\"hl-s\">\"#install\"<\/span><span class=\"hl-p\">&gt;<\/span>跳到安装步骤<span class=\"hl-p\">&lt;/a&gt;<\/span><\/pre><\/div>\n\n<div class=\"card warn\">\n  <div class=\"card-t\">id 重复是隐性 bug<\/div>\n  <p>浏览器<b>不报错<\/b>，但 <code>href=\"#install\"<\/code> 只会跳到<b>第一个<\/b>，\n  JavaScript 的 <code>getElementById<\/code> 也只会拿到第一个。<\/p>\n  <p><b>规则：id 全页唯一。<\/b>需要重复就用 class。<\/p>\n<\/div>\n\n<div class=\"card tip\">\n  <div class=\"card-t\">命名习惯<\/div>\n  <ul>\n    <li>小写 + 连字符：<code>main-nav<\/code>、<code>card-title<\/code>（推荐）<\/li>\n    <li>别用中文和空格（<code>class=\"我的 卡片\"<\/code> 会被当成两个 class）<\/li>\n    <li>别用纯数字开头<\/li>\n  <\/ul>\n<\/div>\n\n<h2 id=\"s9\"><span class=\"n\">9<\/span>一页速查<\/h2>\n\n<table>\n<thead><tr><th style=\"width:32%\">想做的事<\/th><th>写法<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>一段话<\/td><td class=\"c\">&lt;p&gt;文字&lt;/p&gt;<\/td><\/tr>\n<tr><td>倾斜 / 强调<\/td><td class=\"c\">&lt;em&gt;文字&lt;/em&gt;<\/td><\/tr>\n<tr><td>加粗 / 重要<\/td><td class=\"c\">&lt;strong&gt;文字&lt;/strong&gt;<\/td><\/tr>\n<tr><td>给一小段套壳（好上色）<\/td><td class=\"c\">&lt;span class=\"x\"&gt;文字&lt;/span&gt;<\/td><\/tr>\n<tr><td>换行 / 横线<\/td><td class=\"c\">&lt;br&gt;　&lt;hr&gt;<\/td><\/tr>\n<tr><td>标题<\/td><td class=\"c\">&lt;h1&gt;…&lt;/h1&gt; ~ &lt;h6&gt;<\/td><\/tr>\n<tr><td>无序 / 有序列表<\/td><td class=\"c\">&lt;ul&gt;&lt;li&gt;…&lt;/li&gt;&lt;/ul&gt;　&lt;ol&gt;…&lt;/ol&gt;<\/td><\/tr>\n<tr><td>把一块内容分组<\/td><td class=\"c\">&lt;div class=\"x\"&gt;…&lt;/div&gt;<\/td><\/tr>\n<tr><td>链接<\/td><td class=\"c\">&lt;a href=\"url\"&gt;文字&lt;/a&gt;<\/td><\/tr>\n<tr><td>跳本页某处<\/td><td class=\"c\">&lt;a href=\"#id\"&gt;　+　&lt;h2 id=\"id\"&gt;<\/td><\/tr>\n<tr><td>新标签页打开<\/td><td class=\"c\">target=\"_blank\" rel=\"noopener\"<\/td><\/tr>\n<tr><td>表格<\/td><td class=\"c\">&lt;table&gt;&lt;tr&gt;&lt;th&gt;/&lt;td&gt;…<\/td><\/tr>\n<tr><td>合并列 / 行<\/td><td class=\"c\">colspan=\"2\"　rowspan=\"2\"<\/td><\/tr>\n<tr><td>输入框<\/td><td class=\"c\">&lt;input type=\"text\"&gt;<\/td><\/tr>\n<tr><td>复选框 / 单选<\/td><td class=\"c\">type=\"checkbox\"　type=\"radio\" name=\"组名\"<\/td><\/tr>\n<tr><td>多行文本<\/td><td class=\"c\">&lt;textarea&gt;&lt;/textarea&gt;<\/td><\/tr>\n<tr><td>下拉框<\/td><td class=\"c\">&lt;select&gt;&lt;option&gt;…<\/td><\/tr>\n<tr><td>按钮<\/td><td class=\"c\">&lt;button&gt;点我&lt;/button&gt;<\/td><\/tr>\n<tr><td>点文字也能选中控件<\/td><td class=\"c\">&lt;label for=\"id\"&gt;　+　&lt;input id=\"id\"&gt;<\/td><\/tr>\n<tr><td>悬停提示<\/td><td class=\"c\">title=\"提示文字\"<\/td><\/tr>\n<tr><td>批量上样式<\/td><td class=\"c\">class=\"名字\"　→ CSS 里 .名字 { }<\/td><\/tr>\n<tr><td>唯一锚点<\/td><td class=\"c\">id=\"名字\"　→ CSS 里 #名字 { }<\/td><\/tr>\n<\/tbody>\n<\/table>\n\n<div class=\"card key\">\n  <div class=\"card-t\">这一篇要记住的五句话<\/div>\n  <ol>\n    <li><b>块级独占一行（p / div / h / ul / table），行内跟着文字走（span / a / strong）。<\/b><\/li>\n    <li><b><code>span<\/code> 和 <code>div<\/code> 自己没有视觉效果<\/b>，\n      它们的价值是「给 CSS 一个可选的壳」。<\/li>\n    <li><b><code>a<\/code> 靠 <code>href<\/code><\/b>；\n      <code>#id<\/code> 就是目录跳转的原理，不需要 JavaScript。<\/li>\n    <li><b>表格是 <code>table → tr → td/th<\/code> 一层套一层<\/b>，不能跳级。<\/li>\n    <li><b><code>class<\/code> 可重复、用来批量上样式；<code>id<\/code> 全页唯一、用来做锚点。<\/b><\/li>\n  <\/ol>\n<\/div>","series":[{"file":"fe-01.html","num":"FE-01","title":"HTML 入门与标签语法","star":false},{"file":"fe-02.html","num":"FE-02","title":"HTML 常用标签","star":false},{"file":"fe-03-F01.html","num":"FE-03-F01","title":"十六进制颜色模型、HSV 与 Alpha","star":true},{"file":"fe-03.html","num":"FE-03","title":"CSS 入门","star":false},{"file":"fe-04.html","num":"FE-04","title":"CSS 选择器语法","star":true},{"file":"fe-05.html","num":"FE-05","title":"Display 与盒模型尺寸","star":false},{"file":"fe-06.html","num":"FE-06","title":"Writing Mode 与溢出滚动","star":true},{"file":"fe-07.html","num":"FE-07","title":"鼠标悬停与 transition","star":false},{"file":"fe-08.html","num":"FE-08","title":"JavaScript 语法初步","star":false},{"file":"fe-09.html","num":"FE-09","title":"DOM 操作基础","star":true}]};
</script>
