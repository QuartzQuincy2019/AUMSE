window.__FE_PAGE__ = {"file":"fe-09.html","num":"FE-09","title":"DOM 操作基础","star":false,"footerNote":"本篇的 DOM 示例与返回值均在浏览器中实际运行核对（Chromium 内核，21 项断言全过）；Qt 那段对照代码本机无 Qt 工具链，未编译，按 Qt 文档语义整理。","body":"<p><span class=\"lang js\">JS<\/span><\/p>\n\n<p>FE-08 说 JS 是「控制网页行为」的。这一篇就来真的动一下页面 ——\n<b>用 JS 造出新的元素，放进页面里<\/b>。<\/p>\n\n<p>要用的只有三个函数。学会了它们，你就能让页面「长」出东西来。<\/p>\n\n<div class=\"card key\">\n  <div class=\"card-t\">三个函数，一句话分工<\/div>\n  <table>\n  <thead><tr><th style=\"width:44%\">函数<\/th><th>干什么<\/th><\/tr><\/thead>\n  <tbody>\n  <tr><td class=\"c\"><code>document.getElementById(id)<\/code><\/td>\n      <td>按 id <b>找到<\/b>页面上已有的一个元素<\/td><\/tr>\n  <tr><td class=\"c\"><code>document.createElement(tag)<\/code><\/td>\n      <td><b>造<\/b>一个还没有放进页面的新元素<\/td><\/tr>\n  <tr><td class=\"c\"><code>父元素.append(子元素)<\/code><\/td>\n      <td>把子元素<b>放进<\/b>父元素里（这时才看得见）<\/td><\/tr>\n  <\/tbody>\n  <\/table>\n  <p>顺序正好是：<b>找到父元素 → 造出子元素 → 放进去<\/b>。<\/p>\n<\/div>\n\n<div class=\"card note\">\n  <div class=\"card-t\">前置<\/div>\n  <p>FE-08 讲过的 <code>var<\/code>、函数、字符串拼接这一篇会直接用。\n  示例都在浏览器里跑过，输出是实际结果。<\/p>\n<\/div>\n\n<h2 id=\"s1\"><span class=\"n\">1<\/span>先建立直觉：DOM 树<\/h2>\n\n<p>浏览器读到 <code>demo.html<\/code> 之后，不是把文字原样记住就完了 ——\n它把每个标签变成一个<b>对象<\/b>，并按嵌套关系连起来。<\/p>\n\n<div class=\"code-wrap\"><div class=\"bar\"><span class=\"dot r\"><\/span><span class=\"dot y\"><\/span><span class=\"dot g\"><\/span><span class=\"name\">demo.html<\/span><span class=\"cp\">复制<\/span><\/div><pre><span class=\"hl-p\">&lt;body&gt;<\/span>\n  <span class=\"hl-p\">&lt;h1&gt;<\/span>角色面板<span class=\"hl-p\">&lt;/h1&gt;<\/span>\n  <span class=\"hl-p\">&lt;div<\/span> id=<span class=\"hl-s\">\"panel\"<\/span><span class=\"hl-p\">&gt;<\/span>\n    <span class=\"hl-p\">&lt;p&gt;<\/span>忘情牛肉面<span class=\"hl-p\">&lt;/p&gt;<\/span>\n  <span class=\"hl-p\">&lt;/div&gt;<\/span>\n<span class=\"hl-p\">&lt;/body&gt;<\/span><\/pre><\/div>\n\n<p>浏览器心里的结构是这样一棵<b>树<\/b>：<\/p>\n\n<div class=\"domtree\">\n  <div class=\"lv0\">body<\/div>\n  <div class=\"lv1\">├─ h1<span class=\"tx\">「角色面板」<\/span><\/div>\n  <div class=\"lv1\">└─ div <span class=\"at\">id=\"panel\"<\/span><\/div>\n  <div class=\"lv2\">├─ p<span class=\"tx\">「忘情牛肉面」<\/span><\/div>\n  <div class=\"lv2\">└─ <span class=\"ph\">（panel 里还能再放东西）<\/span><\/div>\n<\/div>\n\n<p>每个方框叫一个<b>节点<\/b>，方框之间的连线是<b>父子关系<\/b>。\n这套结构就叫 <b>DOM 树<\/b>（Document Object Model）。<\/p>\n\n<table>\n<thead><tr><th style=\"width:26%\">树上有什么<\/th><th>说明<\/th><\/tr><\/thead>\n<tbody>\n<tr><td><b>标签<\/b><\/td>\n    <td><code>body<\/code>、<code>div<\/code>、<code>p<\/code> ——\n    对应 HTML 里写的标签<\/td><\/tr>\n<tr><td><b>纯文字<\/b><\/td>\n    <td>「角色面板」也是一个节点（文字节点），\n    它没有标签，是某个标签的<b>孩子<\/b><\/td><\/tr>\n<tr><td><b>在 JS 里怎么拿<\/b><\/td>\n    <td>每一个节点都是一个 JS 对象，可以读写它的属性\n    （<code>textContent<\/code>、<code>id<\/code>、<code>className<\/code> …）<\/td><\/tr>\n<\/tbody>\n<\/table>\n\n<div class=\"card tip\">\n  <div class=\"card-t\">为什么叫「树」<\/div>\n  <p>因为每个节点<b>最多只有一个父节点<\/b>，但可以有任意多个子节点 ——\n  从 <code>body<\/code> 往下画，就像树根长出枝和叶，不会有环。<\/p>\n  <p>这条规则带来一个很实用的结论：<b>任何元素都有一个 parent<\/b>，\n  所以「往某个元素里加东西」永远是有意义的操作。这正是下面要讲的核心。<\/p>\n<\/div>\n\n<h2 id=\"s2\"><span class=\"n\">2<\/span>getElementById：把元素拿在手里<\/h2>\n\n<p>想在 JS 里操作一个元素，先得拿到它。最直接的方式是按 <code>id<\/code> 找：<\/p>\n\n<div class=\"code-wrap\"><div class=\"bar\"><span class=\"dot r\"><\/span><span class=\"dot y\"><\/span><span class=\"dot g\"><\/span><span class=\"name\">getById.js<\/span><span class=\"cp\">复制<\/span><\/div><pre><span class=\"hl-c\">// HTML 里：&lt;div id=\"panel\"&gt;&lt;/div&gt;<\/span>\n\n<span class=\"hl-k\">var<\/span> panel = document.getElementById(<span class=\"hl-s\">\"panel\"<\/span>);\n\nconsole.log(panel);              <span class=\"hl-c\">// &lt;div id=\"panel\"&gt;&lt;/div&gt;<\/span>\nconsole.log(panel.tagName);      <span class=\"hl-c\">// \"DIV\"  —— 注意是大写<\/span>\nconsole.log(panel.childNodes.length);  <span class=\"hl-c\">// 0  —— 现在是空的<\/span><\/pre><\/div>\n\n<div class=\"out-wrap\"><div class=\"cap\">控制台输出<\/div><pre>&lt;div id=\"panel\"&gt;&lt;/div&gt;\nDIV\n0<\/pre><\/div>\n\n<div class=\"card warn\">\n  <div class=\"card-t\">两个必须知道的细节<\/div>\n  <ol>\n    <li><b>找不到就返回 <code>null<\/code><\/b>，不报错。\n    所以拿到之后要用 <code>if (panel)<\/code> 判一下，否则后面一用就崩。<\/li>\n    <li><b>id 区分大小写<\/b>。<code>getElementById(\"Panel\")<\/code> 找不到\n    <code>id=\"panel\"<\/code> 的那个元素。<\/li>\n  <\/ol>\n<\/div>\n\n<div class=\"code-wrap\"><div class=\"bar\"><span class=\"dot r\"><\/span><span class=\"dot y\"><\/span><span class=\"dot g\"><\/span><span class=\"name\">忘记判空的后果<\/span><span class=\"cp\">复制<\/span><\/div><pre><span class=\"hl-c\">// ❌ 页面上没有 id=\"nope\" 的元素<\/span>\n<span class=\"hl-k\">var<\/span> x = document.getElementById(<span class=\"hl-s\">\"nope\"<\/span>);\nconsole.log(x);            <span class=\"hl-c\">// null<\/span>\nx.append(<span class=\"hl-s\">\"文字\"<\/span>);          <span class=\"hl-c\">// 💥 TypeError: Cannot read properties of null<\/span>\n\n<span class=\"hl-c\">// ✅ 先判一下<\/span>\n<span class=\"hl-k\">var<\/span> y = document.getElementById(<span class=\"hl-s\">\"nope\"<\/span>);\n<span class=\"hl-k\">if<\/span> (y) {\n    y.append(<span class=\"hl-s\">\"文字\"<\/span>);\n} <span class=\"hl-k\">else<\/span> {\n    console.log(<span class=\"hl-s\">\"没找到这个 id\"<\/span>);\n}<\/pre><\/div>\n\n<div class=\"out-wrap\"><div class=\"cap\">控制台输出<\/div><pre>null\n没找到这个 id<\/pre><\/div>\n\n<h2 id=\"s3\"><span class=\"n\">3<\/span>createElement：凭空造一个元素<\/h2>\n\n<p><code>document.createElement(\"标签名\")<\/code> 造出一个新元素。<\/p>\n\n<div class=\"code-wrap\"><div class=\"bar\"><span class=\"dot r\"><\/span><span class=\"dot y\"><\/span><span class=\"dot g\"><\/span><span class=\"name\">create.js<\/span><span class=\"cp\">复制<\/span><\/div><pre><span class=\"hl-k\">var<\/span> p = document.createElement(<span class=\"hl-s\">\"p\"<\/span>);\n\nconsole.log(p.tagName);        <span class=\"hl-c\">// \"P\"<\/span>\nconsole.log(p.isConnected);    <span class=\"hl-c\">// false —— 造出来了，但**还不在页面上**<\/span>\n\np.textContent = <span class=\"hl-s\">\"忘情牛肉面\"<\/span>;   <span class=\"hl-c\">// 往里填文字<\/span>\np.id = <span class=\"hl-s\">\"heroName\"<\/span>;              <span class=\"hl-c\">// 给它一个 id<\/span>\np.className = <span class=\"hl-s\">\"name big\"<\/span>;       <span class=\"hl-c\">// 给它类名（可多个，空格隔开）<\/span>\n\nconsole.log(p.textContent);    <span class=\"hl-c\">// \"忘情牛肉面\"<\/span><\/pre><\/div>\n\n<div class=\"out-wrap\"><div class=\"cap\">控制台输出<\/div><pre>P\nfalse\n忘情牛肉面<\/pre><\/div>\n\n<div class=\"card key\">\n  <div class=\"card-t\">最容易忽略的一点：造出来 ≠ 显示出来<\/div>\n  <p><code>createElement<\/code> 造出的元素<b>只活在内存里<\/b> ——\n  <code>isConnected<\/code> 是 <code>false<\/code>，屏幕上什么都没有。<\/p>\n  <p>填文字、设 id、加类名，随便怎么改，<b>只要没放进去，页面上就看不见<\/b>。\n  要显示，必须做下一步：<code>append<\/code>。<\/p>\n<\/div>\n\n<div class=\"card tip\">\n  <div class=\"card-t\">顺手说：textContent 是安全的<\/div>\n  <p>把尖括号写进 <code>textContent<\/code>，它<b>当纯文字显示，不会变成标签<\/b>：<\/p>\n  <pre style=\"margin:6px 0 0\"><code>p.textContent = \"&lt;b&gt;不是标签&lt;/b&gt;\";\nconsole.log(p.textContent);   // \"&lt;b&gt;不是标签&lt;/b&gt;\"\nconsole.log(p.querySelector(\"b\"));   // null —— 里面没有 b 元素<\/code><\/pre>\n  <p>所以用户输入的内容用 <code>textContent<\/code> 填是安全的。<\/p>\n<\/div>\n\n<h2 id=\"s4\"><span class=\"n\">4<\/span>append：放进父元素，这才看得见<\/h2>\n\n<p><code>父元素.append(子元素)<\/code> 把子元素挂到父元素下面。\n<b>做完这一步，页面上才出现它。<\/b><\/p>\n\n<div class=\"code-wrap\"><div class=\"bar\"><span class=\"dot r\"><\/span><span class=\"dot y\"><\/span><span class=\"dot g\"><\/span><span class=\"name\">append.js<\/span><span class=\"cp\">复制<\/span><\/div><pre><span class=\"hl-c\">// ① 找到父元素<\/span>\n<span class=\"hl-k\">var<\/span> panel = document.getElementById(<span class=\"hl-s\">\"panel\"<\/span>);\n\n<span class=\"hl-c\">// ② 造一个子元素<\/span>\n<span class=\"hl-k\">var<\/span> p = document.createElement(<span class=\"hl-s\">\"p\"<\/span>);\np.textContent = <span class=\"hl-s\">\"忘情牛肉面\"<\/span>;\n\nconsole.log(p.isConnected);    <span class=\"hl-c\">// false —— 还没放<\/span>\n\n<span class=\"hl-c\">// ③ 放进去<\/span>\npanel.append(p);\n\nconsole.log(p.isConnected);    <span class=\"hl-c\">// true —— 已经在页面上了<\/span>\nconsole.log(panel.childNodes.length);   <span class=\"hl-c\">// 1<\/span><\/pre><\/div>\n\n<div class=\"out-wrap\"><div class=\"cap\">控制台输出<\/div><pre>false\ntrue\n1<\/pre><\/div>\n\n<p>三步连起来就是这一篇的骨架：<b>找到父元素 → 造子元素 → append<\/b>。<\/p>\n\n<h3>append 能接什么<\/h3>\n\n<p><code>append<\/code> 比想象中宽松 —— <b>字符串也能直接给<\/b>，它会自动变成文字：<\/p>\n\n<div class=\"code-wrap\"><div class=\"bar\"><span class=\"dot r\"><\/span><span class=\"dot y\"><\/span><span class=\"dot g\"><\/span><span class=\"name\">append 的几种给法<\/span><span class=\"cp\">复制<\/span><\/div><pre><span class=\"hl-k\">var<\/span> box = document.createElement(<span class=\"hl-s\">\"div\"<\/span>);\n\nbox.append(<span class=\"hl-s\">\"直接给字符串\"<\/span>);              <span class=\"hl-c\">// 自动变成文字节点<\/span>\nbox.append(document.createElement(<span class=\"hl-s\">\"b\"<\/span>));  <span class=\"hl-c\">// 给元素<\/span>\nbox.append(<span class=\"hl-s\">\"x\"<\/span>, document.createElement(<span class=\"hl-s\">\"b\"<\/span>), <span class=\"hl-s\">\"y\"<\/span>);\n                              <span class=\"hl-c\">// 一次给多个，按顺序放<\/span>\n\nconsole.log(box.childNodes.length);   <span class=\"hl-c\">// 5<\/span><\/pre><\/div>\n\n<div class=\"out-wrap\"><div class=\"cap\">控制台输出<\/div><pre>5<\/pre><\/div>\n\n<div class=\"card warn\">\n  <div class=\"card-t\">append 是「移动」，不是「复制」<\/div>\n  <p>一个节点<b>只能有一个父节点<\/b>。把已经在 A 里的节点 append 给 B，\n  它就从 A <b>搬走<\/b>了：<\/p>\n  <pre style=\"margin:6px 0 0\"><code>var A = document.createElement(\"div\");\nvar B = document.createElement(\"div\");\nvar kid = document.createElement(\"span\");\n\nA.append(kid);\nB.append(kid);        // 从 A 移到 B，不是复制一份\n\nconsole.log(A.childNodes.length);   // 0\nconsole.log(B.childNodes.length);   // 1<\/code><\/pre>\n  <p>想真正复制一份，得先 <code>kid.cloneNode(true)<\/code> 再 append 克隆体。<\/p>\n<\/div>\n\n<div class=\"card note\">\n  <div class=\"card-t\">老代码里的 appendChild<\/div>\n  <p>你会在旧代码里看到 <code>appendChild<\/code>。它和 <code>append<\/code>\n  干的是同一件事，但<b>只收节点<\/b> —— 给字符串直接抛错：<\/p>\n  <pre style=\"margin:6px 0 0\"><code>box.appendChild(\"文字\");   // 💥 TypeError<\/code><\/pre>\n  <p>另一个区别：<code>appendChild<\/code> 返回被插入的节点，\n  <code>append<\/code> 返回 <code>undefined<\/code>。\n  新代码用 <code>append<\/code> 就行，更好写。<\/p>\n<\/div>\n\n<h2 id=\"s5\"><span class=\"n\">5<\/span>串起来：一个能跑的小例子<\/h2>\n\n<div class=\"code-wrap\"><div class=\"bar\"><span class=\"dot r\"><\/span><span class=\"dot y\"><\/span><span class=\"dot g\"><\/span><span class=\"name\">demo.html<\/span><span class=\"cp\">复制<\/span><\/div><pre><span class=\"hl-p\">&lt;!DOCTYPE html&gt;<\/span>\n<span class=\"hl-p\">&lt;html<\/span> lang=<span class=\"hl-s\">\"zh-CN\"<\/span><span class=\"hl-p\">&gt;<\/span>\n<span class=\"hl-p\">&lt;head&gt;&lt;meta<\/span> charset=<span class=\"hl-s\">\"utf-8\"<\/span><span class=\"hl-p\">&gt;&lt;/head&gt;<\/span>\n<span class=\"hl-p\">&lt;body&gt;<\/span>\n  <span class=\"hl-p\">&lt;h1&gt;<\/span>角色面板<span class=\"hl-p\">&lt;/h1&gt;<\/span>\n  <span class=\"hl-p\">&lt;div<\/span> id=<span class=\"hl-s\">\"panel\"<\/span><span class=\"hl-p\">&gt;&lt;/div&gt;<\/span>\n  <span class=\"hl-p\">&lt;script<\/span> src=<span class=\"hl-s\">\"demo.js\"<\/span><span class=\"hl-p\">&gt;&lt;/script&gt;<\/span>\n<span class=\"hl-p\">&lt;/body&gt;<\/span>\n<span class=\"hl-p\">&lt;/html&gt;<\/span><\/pre><\/div>\n\n<div class=\"code-wrap\"><div class=\"bar\"><span class=\"dot r\"><\/span><span class=\"dot y\"><\/span><span class=\"dot g\"><\/span><span class=\"name\">demo.js<\/span><span class=\"cp\">复制<\/span><\/div><pre><span class=\"hl-k\">var<\/span> names = [<span class=\"hl-s\">\"忘情牛肉面\"<\/span>, <span class=\"hl-s\">\"奶蛙\"<\/span>, <span class=\"hl-s\">\"University of Naiwa\"<\/span>];\n\n<span class=\"hl-k\">var<\/span> panel = document.getElementById(<span class=\"hl-s\">\"panel\"<\/span>);\n\n<span class=\"hl-k\">for<\/span> (<span class=\"hl-k\">var<\/span> i = 0; i &lt; names.length; i++) {\n    <span class=\"hl-k\">var<\/span> p = document.createElement(<span class=\"hl-s\">\"p\"<\/span>);   <span class=\"hl-c\">// 造<\/span>\n    p.textContent = names[i];                    <span class=\"hl-c\">// 填<\/span>\n    panel.append(p);                             <span class=\"hl-c\">// 放<\/span>\n}<\/pre><\/div>\n\n<div class=\"out-wrap\"><div class=\"cap\">页面上出现<\/div><pre>角色面板\n\n忘情牛肉面\n奶蛙\nUniversity of Naiwa<\/pre><\/div>\n\n<div class=\"card tip\">\n  <div class=\"card-t\">为什么这个循环每轮都要重新 createElement<\/div>\n  <p>因为 <code>append<\/code> 是移动。如果在循环外只造一个 <code>p<\/code>，\n  那么第二轮 append 会把它<b>从第一行的位置搬走<\/b> ——\n  最后页面上只剩一行。<\/p>\n  <p>「每轮造一个新的」是这里的固定套路。第 4 节那条「移动不是复制」\n  说的就是这件事。<\/p>\n<\/div>\n\n<h2 id=\"s6\"><span class=\"n\">6<\/span>重点：这和 Qt 的 addWidget 是一回事<\/h2>\n\n<p>如果你写过 Qt，上面那三步其实<b>一点也不陌生<\/b> ——\n把它和 Qt 的写法并排看：<\/p>\n\n<div class=\"two\">\n  <div class=\"side\">\n    <div class=\"hd\">Qt（C++）<\/div>\n<pre>// ① 拿到容器\nauto *panel = findChild&lt;QWidget*&gt;(\"panel\");\n\n// ② 造一个子控件\nauto *label = new QLabel(\"忘情牛肉面\");\n\n// ③ 放进容器\npanel-&gt;layout()-&gt;addWidget(label);<\/pre>\n  <\/div>\n  <div class=\"side\">\n    <div class=\"hd good\">DOM（JS）<\/div>\n<pre>// ① 拿到父元素\nvar panel = document.getElementById(\"panel\");\n\n// ② 造一个子元素\nvar p = document.createElement(\"p\");\np.textContent = \"忘情牛肉面\";\n\n// ③ 放进父元素\npanel.append(p);<\/pre>\n  <\/div>\n<\/div>\n\n<p>两边都是<b>同一个动作<\/b>：<code>容器.add(子件)<\/code>。<\/p>\n\n<div class=\"card key\">\n  <div class=\"card-t\">关键认识：把 DOM 元素当成 Widget 看<\/div>\n  <p><b>如果将要添加的元素视作组件（Widget），那么「向父元素添加子元素」\n  和 Qt 的 <code>addWidget<\/code> 完全相同。<\/b><\/p>\n  <p>都是：<b>先有容器 → 再造子件 → 把子件交给容器托管<\/b>。\n  子件从交出那一刻起就归容器管，显示、位置、生命周期都跟着容器走。<\/p>\n<\/div>\n\n<h3>逐项对照<\/h3>\n\n<table>\n<thead><tr><th style=\"width:30%\">要做的事<\/th><th style=\"width:36%\">Qt<\/th><th>DOM（JS）<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>造一个组件<\/td><td class=\"c\"><code>new QLabel(\"…\")<\/code><\/td>\n    <td class=\"c\"><code>document.createElement(\"p\")<\/code><\/td><\/tr>\n<tr><td>设它显示的文字<\/td><td class=\"c\"><code>label-&gt;setText(…)<\/code><\/td>\n    <td class=\"c\"><code>p.textContent = …<\/code><\/td><\/tr>\n<tr><td><b>加进容器<\/b><\/td>\n    <td class=\"c\"><code>layout-&gt;addWidget(label)<\/code><\/td>\n    <td class=\"c\"><code>parent.append(p)<\/code><\/td><\/tr>\n<tr><td>按名字找控件<\/td><td class=\"c\"><code>findChild&lt;QWidget*&gt;(\"panel\")<\/code><\/td>\n    <td class=\"c\"><code>document.getElementById(\"panel\")<\/code><\/td><\/tr>\n<tr><td>给组件起个名字/标识<\/td><td class=\"c\"><code>setObjectName(\"panel\")<\/code><\/td>\n    <td class=\"c\"><code>el.id = \"panel\"<\/code><\/td><\/tr>\n<tr><td>加样式类<\/td><td class=\"c\"><code>setProperty(\"class\", …)<\/code> + QSS<\/td>\n    <td class=\"c\"><code>el.className = \"name big\"<\/code><\/td><\/tr>\n<tr><td>子件构造后立刻可见？<\/td><td class=\"c\">不会，要 addWidget 之后才进布局<\/td>\n    <td class=\"c\">不会，要 append 之后才进文档<\/td><\/tr>\n<\/tbody>\n<\/table>\n\n<div class=\"card tip\">\n  <div class=\"card-t\">一处不同：Qt 有独立的 layout，DOM 没有<\/div>\n  <p>Qt 里 <code>addWidget<\/code> 是加在 <b>layout<\/b> 上，\n  widget 自己不管怎么摆孩子。DOM 里没有 layout 这个角色 ——\n  <b>元素自己既是 widget，又是容器<\/b>，摆放交给 CSS（flex / grid）。<\/p>\n  <p>所以 Qt 那句是 <code>panel-&gt;layout()-&gt;addWidget(x)<\/code>，\n  DOM 这句是 <code>panel.append(x)<\/code>。少了一层，但意思一样：\n  <b>「把这个子件交给这个容器」<\/b>。<\/p>\n<\/div>\n\n<div class=\"card warn\">\n  <div class=\"card-t\">一个对应不上的地方：生命周期<\/div>\n  <p>Qt 里 <code>addWidget<\/code> 之后，widget 归父控件所有（父子对象树），\n  父对象析构时会一起 delete。DOM 里把节点 append 进去，\n  它也只是「挂在文档上」—— 想移除要显式 <code>remove()<\/code>，\n  没有自动回收那一套。<\/p>\n  <p><b>「谁来释放」这件事，两边答案不同。<\/b>\n  类比能帮你快速上手，但别把它当成完全等价。<\/p>\n<\/div>\n\n<h2 id=\"s7\"><span class=\"n\">7<\/span>多行代码里常见的写法<\/h2>\n\n<p>把「造 + 填 + 放」写成一个小函数，是实际项目里最常见的整理方式：<\/p>\n\n<div class=\"code-wrap\"><div class=\"bar\"><span class=\"dot r\"><\/span><span class=\"dot y\"><\/span><span class=\"dot g\"><\/span><span class=\"name\">makeRow.js<\/span><span class=\"cp\">复制<\/span><\/div><pre><span class=\"hl-c\">// 造一个 &lt;p class=\"row\"&gt;文字&lt;/p&gt; 并放进 parent<\/span>\n<span class=\"hl-k\">function<\/span> addRow(parent, text) {\n    <span class=\"hl-k\">var<\/span> p = document.createElement(<span class=\"hl-s\">\"p\"<\/span>);\n    p.className = <span class=\"hl-s\">\"row\"<\/span>;\n    p.textContent = text;\n    parent.append(p);\n    <span class=\"hl-k\">return<\/span> p;              <span class=\"hl-c\">// 返回它，方便以后再改<\/span>\n}\n\n<span class=\"hl-k\">var<\/span> panel = document.getElementById(<span class=\"hl-s\">\"panel\"<\/span>);\naddRow(panel, <span class=\"hl-s\">\"忘情牛肉面\"<\/span>);\naddRow(panel, <span class=\"hl-s\">\"奶蛙\"<\/span>);<\/pre><\/div>\n\n<div class=\"card tip\">\n  <div class=\"card-t\">为什么把 parent 当参数传<\/div>\n  <p>这样这个函数<b>不关心父元素是谁<\/b> —— 同一个 <code>addRow<\/code>\n  可以往任何容器里加行。和 Qt 里写\n  <code>void addRow(QWidget *parent, …)<\/code> 是一个思路。<\/p>\n<\/div>\n\n<h2 id=\"s8\"><span class=\"n\">8<\/span>一页速查<\/h2>\n\n<h3>三个函数<\/h3>\n\n<table>\n<thead><tr><th style=\"width:38%\">写法<\/th><th style=\"width:24%\">返回<\/th><th>说明<\/th><\/tr><\/thead>\n<tbody>\n<tr><td class=\"c\"><code>document.getElementById(\"panel\")<\/code><\/td>\n    <td class=\"c\">元素 或 <code>null<\/code><\/td><td>按 id 找，区分大小写<\/td><\/tr>\n<tr><td class=\"c\"><code>document.createElement(\"p\")<\/code><\/td>\n    <td class=\"c\">新元素<\/td><td>只在内存里，还没显示<\/td><\/tr>\n<tr><td class=\"c\"><code>parent.append(child)<\/code><\/td>\n    <td class=\"c\"><code>undefined<\/code><\/td><td>放进去，这才显示；是<b>移动<\/b><\/td><\/tr>\n<\/tbody>\n<\/table>\n\n<h3>三句话<\/h3>\n\n<div class=\"mnemonic\">\n  <b>① DOM 树 = 浏览器心里的结构<\/b> ——\n  每个标签是一个节点，节点之间有父子关系，每个节点最多一个父亲。<br>\n  <b>② 找父 → 造子 → append<\/b> ——\n  造出来不等于显示出来，<code>append<\/code> 之后才在页面上。<br>\n  <b>③ 元素就是 Widget<\/b> ——\n  <code>parent.append(child)<\/code> 与 Qt 的 <code>addWidget<\/code>\n  是同一个动作：把子件交给容器。\n<\/div>\n\n<h3>最容易踩的三个坑<\/h3>\n\n<table>\n<thead><tr><th style=\"width:44%\">现象<\/th><th>原因<\/th><\/tr><\/thead>\n<tbody>\n<tr><td class=\"c\">造了元素但页面没变化<\/td>\n    <td>忘了 <code>append<\/code>（或 append 给了错的父元素）<\/td><\/tr>\n<tr><td class=\"c\">循环加了很多行，却只看到一行<\/td>\n    <td>在循环外只 <code>createElement<\/code> 了一次 ——\n    append 是移动，要每轮造新的<\/td><\/tr>\n<tr><td class=\"c\">TypeError: Cannot read properties of null<\/td>\n    <td><code>getElementById<\/code> 没找到，返回了 <code>null<\/code>；\n    取到之后要先判空<\/td><\/tr>\n<\/tbody>\n<\/table>\n\n<div class=\"card key\">\n  <div class=\"card-t\">一句话<\/div>\n  <p><b>页面上的一切都可以用这三个函数造出来。<\/b>\n  先找到要往哪儿放，再造出要放的东西，最后 append 进去 ——\n  和 Qt 里「造控件、addWidget」是同一套动作。<\/p>\n<\/div>\n\n<h2 id=\"s9\"><span class=\"n\">9<\/span>动手做<\/h2>\n\n<div class=\"card tip\">\n  <div class=\"card-t\">五分钟练习<\/div>\n  <ol>\n    <li>写一个只含 <code>&lt;div id=\"panel\"&gt;&lt;/div&gt;<\/code> 的 HTML，\n    外加一个空的 <code>demo.js<\/code>。<\/li>\n    <li>在 <code>demo.js<\/code> 里，用 <code>createElement<\/code> +\n    <code>append<\/code> 往 panel 里放三个 <code>&lt;p&gt;<\/code>。<\/li>\n    <li>刷新页面确认出现三行。<\/li>\n    <li>把 <code>createElement<\/code> 提到循环<b>外面<\/b>再跑一次 ——\n    看清「只剩一行」，就真正理解 append 是移动了。<\/li>\n    <li>最后把 <code>id<\/code> 改成一个页面上不存在的值，\n    看控制台报什么错，然后补上判空。<\/li>\n  <\/ol>\n<\/div>\n\n<div class=\"card note\">\n  <div class=\"card-t\">接下来看什么<\/div>\n  <p>这一篇讲的是「造和放」。往下走还有两件事值得单独看：<\/p>\n  <ul>\n    <li><b>事件<\/b> —— 造出来的按钮怎么才能点得动\n    （<code>addEventListener<\/code>，对应 Qt 的 <code>connect<\/code>）；<\/li>\n    <li><b>查找与遍历<\/b> —— <code>querySelector<\/code> /\n    <code>querySelectorAll<\/code>，按选择器找元素，\n    比 <code>getElementById<\/code> 通用得多。<\/li>\n  <\/ul>\n<\/div>\n\n<div class=\"see-also\">\n  <div class=\"hd\">延伸阅读<\/div>\n  <ul>\n    <li><a href=\"fe-03.html\">FE-03 · CSS 入门<\/a>\n      <span class=\"why\">—— 造出来的元素长什么样，由 CSS 决定；\n      这一篇讲的类选择器正是给新元素加样式用的。<\/span><\/li>\n    <li><a href=\"q04-interfaces.html\">Q04 · 接口<\/a>\n      <span class=\"why\">—— Qt 那侧的 <code>addWidget<\/code> 属于控件的对外接口，\n      想弄清「为什么要有接口」可以对照看。<\/span><\/li>\n  <\/ul>\n<\/div>","series":[{"file":"fe-01.html","num":"FE-01","title":"HTML 入门与标签语法","star":false},{"file":"fe-02.html","num":"FE-02","title":"HTML 常用标签","star":false},{"file":"fe-03-F01.html","num":"FE-03-F01","title":"十六进制颜色模型、HSV 与 Alpha","star":true},{"file":"fe-03.html","num":"FE-03","title":"CSS 入门","star":false},{"file":"fe-04.html","num":"FE-04","title":"CSS 选择器语法","star":false},{"file":"fe-05.html","num":"FE-05","title":"Display 与盒模型尺寸","star":false},{"file":"fe-06.html","num":"FE-06","title":"Writing Mode 与溢出滚动","star":true},{"file":"fe-07.html","num":"FE-07","title":"鼠标悬停与 transition","star":false},{"file":"fe-08.html","num":"FE-08","title":"JavaScript 语法初步","star":false},{"file":"fe-09.html","num":"FE-09","title":"DOM 操作基础","star":false}]};
