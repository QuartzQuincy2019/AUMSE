window.__FE_PAGE__ = {"file":"fe-03.html","num":"FE-03","title":"CSS 入门","star":false,"body":"<div class=\"card note\">\n  <div class=\"card-t\">这一篇讲什么<\/div>\n  <p>HTML 决定「<b>有什么<\/b>」，CSS 决定「<b>长什么样<\/b>」。<\/p>\n  <p>这一篇讲 CSS 的<b>语法<\/b>和一批<b>最常用的属性<\/b>：\n  字体、颜色、文字装饰、阴影、光标。<\/p>\n  <p>凡是有视觉效果的知识点，下面都配了<b>「示例展示」<\/b> ——\n  代码块下面的框里就是真实渲染出来的样子。<\/p>\n  <p><b>选择器的详细语法另有一篇<\/b>：FE-04《CSS 选择器语法》。<\/p>\n<\/div>\n\n<h2 id=\"s1\"><span class=\"n\">1<\/span>CSS 是什么<\/h2>\n\n<p><b>CSS = Cascading Style Sheets（层叠样式表）<\/b>。<\/p>\n\n<table>\n<thead><tr><th style=\"width:24%\">词<\/th><th>含义<\/th><\/tr><\/thead>\n<tbody>\n<tr><td><b>Style<\/b><\/td><td>样式 —— 它只管外观，不管内容<\/td><\/tr>\n<tr><td><b>Sheet<\/b><\/td><td>一张表 —— 一堆样式规则写在一起<\/td><\/tr>\n<tr><td><b>Cascading<\/b><\/td><td><b>层叠<\/b> —— 多条规则可以同时作用于一个元素，\n  按优先级决定谁赢（第 9 节讲）<\/td><\/tr>\n<\/tbody>\n<\/table>\n\n<div class=\"card key\">\n  <div class=\"card-t\">核心思路：选中 + 描述<\/div>\n  <p>CSS 的每一条规则都在回答两个问题：<\/p>\n  <ol>\n    <li><b>选中谁？<\/b>（选择器）<\/li>\n    <li><b>把它怎么样？<\/b>（属性: 值）<\/li>\n  <\/ol>\n  <p>就这么简单。<b>难的不是语法，是「怎么组合出想要的效果」。<\/b><\/p>\n<\/div>\n\n<h2 id=\"s2\"><span class=\"n\">2<\/span>三种写 CSS 的位置<\/h2>\n\n<div class=\"code-wrap\"><div class=\"bar\"><span class=\"dot r\"><\/span><span class=\"dot y\"><\/span><span class=\"dot g\"><\/span><span class=\"name\">① 行内样式：直接写在标签上<\/span><span class=\"cp\">复制<\/span><\/div><pre>&lt;p style=\"color: red; font-size: 20px;\"&gt;红字&lt;/p&gt;<\/pre><\/div>\n\n<div class=\"code-wrap\"><div class=\"bar\"><span class=\"dot r\"><\/span><span class=\"dot y\"><\/span><span class=\"dot g\"><\/span><span class=\"name\">② 内部样式表：写在 head 里的 style 标签<\/span><span class=\"cp\">复制<\/span><\/div><pre>&lt;head&gt;\n  &lt;style&gt;\n    p { color: red; }\n  &lt;/style&gt;\n&lt;/head&gt;<\/pre><\/div>\n\n<div class=\"code-wrap\"><div class=\"bar\"><span class=\"dot r\"><\/span><span class=\"dot y\"><\/span><span class=\"dot g\"><\/span><span class=\"name\">③ 外部样式表：单独一个 .css 文件（推荐）<\/span><span class=\"cp\">复制<\/span><\/div><pre>&lt;!-- HTML 里只写一行链接 --&gt;\n&lt;link rel=\"stylesheet\" href=\"assets/style.css\"&gt;\n\n/* style.css 里写规则 */\np { color: red; }<\/pre><\/div>\n\n<table>\n<thead><tr><th style=\"width:20%\"><\/th><th style=\"width:26%\">优点<\/th><th>缺点<\/th><\/tr><\/thead>\n<tbody>\n<tr><td><b>行内<\/b><\/td><td>立刻生效，好调试<\/td>\n    <td><b>优先级最高、难覆盖<\/b>；改一处要翻 HTML；不能复用<\/td><\/tr>\n<tr><td><b>内部<\/b><\/td><td>一个文件搞定，适合单页小 demo<\/td>\n    <td>多个页面要各写一遍<\/td><\/tr>\n<tr><td><b>外部<\/b><\/td><td><span class=\"tag g\">推荐<\/span>\n      <b>多个页面共用一份<\/b>，浏览器还会缓存<\/td>\n    <td>多一个文件要管<\/td><\/tr>\n<\/tbody>\n<\/table>\n\n<div class=\"card tip\">\n  <div class=\"card-t\">本系列文档用的是哪一种<\/div>\n  <p>一开始是<b>内部样式表<\/b>，后来改成了<b>外部样式表<\/b> ——\n  每篇一个 <code>assets/fe-0N.css<\/code>。<\/p>\n  <p>原因很实际：15 篇教程原本各自内嵌一份几乎相同的 CSS，\n  总共 28 万字符；抽出来之后只剩 8 万。<b>这就是外部样式表的价值。<\/b><\/p>\n<\/div>\n\n<h2 id=\"s3\"><span class=\"n\">3<\/span>语法：选择器 + 声明块<\/h2>\n\n<div class=\"code-wrap\"><div class=\"bar\"><span class=\"dot r\"><\/span><span class=\"dot y\"><\/span><span class=\"dot g\"><\/span><span class=\"name\">一条规则的解剖<\/span><span class=\"cp\">复制<\/span><\/div><pre><span class=\"hl-f\">.card<\/span> <span class=\"arw\">{<\/span>\n    <span class=\"hl-k\">color<\/span>: <span class=\"hl-n\">red<\/span>;\n    <span class=\"hl-k\">font-size<\/span>: <span class=\"hl-n\">16px<\/span>;\n<span class=\"arw\">}<\/span>\n<span class=\"arw\">└─┬─┘ │  └──┬──┘ └─┬┘ │<\/span>\n<span class=\"arw\">  │   │     │      │  └─ 分号结尾（最后一条可省，但建议都写）<\/span>\n<span class=\"arw\">  │   │     │      └─ 值<\/span>\n<span class=\"arw\">  │   │     └─ 冒号<\/span>\n<span class=\"arw\">  │   └─ 属性名<\/span>\n<span class=\"arw\">  └─ 选择器：选中谁<\/span><\/pre><\/div>\n\n<div class=\"card warn\">\n  <div class=\"card-t\">三个最容易写错的地方<\/div>\n  <ol>\n    <li><b>用冒号不是等号<\/b>：<code>color: red<\/code>，\n      不是 <code>color = red<\/code><\/li>\n    <li><b>用花括号不是圆括号<\/b>：<code>{ }<\/code><\/li>\n    <li><b>每条声明末尾要有分号<\/b>（漏了会让下一条也失效）<\/li>\n  <\/ol>\n  <p><b>好消息<\/b>：CSS 出错不报错，只是那条不生效 ——\n  靠 F12 的 Styles 面板能看到哪条被划掉了。<\/p>\n<\/div>\n\n<h4>注释<\/h4>\n<div class=\"code-wrap\"><div class=\"bar\"><span class=\"dot r\"><\/span><span class=\"dot y\"><\/span><span class=\"dot g\"><\/span><span class=\"name\">CSS 只有一种注释<\/span><span class=\"cp\">复制<\/span><\/div><pre><span class=\"hl-c\">/* 这是 CSS 注释，可以跨行 */<\/span>\n<span class=\"hl-k\">color<\/span>: red;  <span class=\"hl-c\">/* 也可以写在行尾 */<\/span>\n\n<span class=\"hl-c\">/* 注意：CSS 里不能用 // ，那是 JS 和 C 的 */<\/span><\/pre><\/div>\n\n<h2 id=\"s4\"><span class=\"n\">4<\/span>常用选择器<\/h2>\n\n<table>\n<thead><tr><th style=\"width:24%\">写法<\/th><th style=\"width:26%\">选中什么<\/th><th>例子<\/th><\/tr><\/thead>\n<tbody>\n<tr><td class=\"c\">p<\/td><td>所有 <code>&lt;p&gt;<\/code> 标签<\/td>\n    <td class=\"c\">p { }<\/td><\/tr>\n<tr><td class=\"c\">.card<\/td><td><b>class 含 card 的所有元素<\/b><\/td>\n    <td class=\"c\">.card { }&nbsp;&nbsp;← 最常用<\/td><\/tr>\n<tr><td class=\"c\">#header<\/td><td>id 是 header 的那<b>一个<\/b><\/td>\n    <td class=\"c\">#header { }<\/td><\/tr>\n<tr><td class=\"c\">*<\/td><td>所有元素<\/td><td class=\"c\">* { }<\/td><\/tr>\n<tr><td class=\"c\">div p<\/td><td>div <b>里面<\/b>的所有 p（后代）<\/td>\n    <td class=\"c\">.card p { }<\/td><\/tr>\n<tr><td class=\"c\">div &gt; p<\/td><td>div 的<b>直接子元素<\/b>里的 p<\/td>\n    <td class=\"c\">.card &gt; p { }<\/td><\/tr>\n<tr><td class=\"c\">.a, .b<\/td><td>a <b>或<\/b> b（并列）<\/td>\n    <td class=\"c\">h1, h2 { }<\/td><\/tr>\n<tr><td class=\"c\">a:hover<\/td><td>鼠标<b>悬停<\/b>时的 a<\/td>\n    <td class=\"c\">.btn:hover { }&nbsp;&nbsp;← FE-07<\/td><\/tr>\n<tr><td class=\"c\">[href=\"\"]<\/td><td>属性等于某值的元素<\/td>\n    <td class=\"c\">a[href^=\"https\"] { }<\/td><\/tr>\n<\/tbody>\n<\/table>\n\n<div class=\"card tip\">\n  <div class=\"card-t\">选择器另有一篇专讲<\/div>\n  <p>上面这张表够日常用。但属性限定、伪类、伪元素、优先级这些\n  <b>值得单独一篇<\/b> —— 见 <b>FE-04《CSS 选择器语法》<\/b>，\n  那一篇每个知识点都配了示例展示。<\/p>\n<\/div>\n\n<h2 id=\"s5\"><span class=\"n\">5<\/span>字体相关<\/h2>\n\n<h4>font-family 字体回退链<\/h4>\n<div class=\"pv-wrap\" data-pv=\"1\" data-pv-kind=\"css\"><div class=\"code-wrap\"><div class=\"bar\"><span class=\"dot r\"><\/span><span class=\"dot y\"><\/span><span class=\"dot g\"><\/span><span class=\"name\">font-family 字体回退链<\/span><span class=\"cp\">复制<\/span><\/div><pre><span class=\"hl-c\">/* 浏览器的查找顺序：有 Consolas 用它，没有就试下一个 */<\/span>\n\n.mono {\n    font-family: \"Consolas\", \"Cascadia Mono\", monospace;\n}\n\n.sans {\n    font-family: \"Microsoft YaHei\", \"PingFang SC\", sans-serif;\n}\n\n.serif {\n    font-family: Georgia, \"Times New Roman\", serif;\n}<\/pre><\/div><div class=\"pv-frame\"><div class=\"pv-cap\">font-family 字体回退链<\/div><div class=\"pv-body\"><p class=\"mono\">Consolas 等宽：0123456789 abcXYZ<\/p><p class=\"sans\">Microsoft YaHei 无衬线：中文与 English 混排<\/p><p class=\"serif\">Georgia 衬线：The quick brown fox<\/p><\/div><\/div><\/div>\n<p>写法是<b>一串候选，逗号隔开<\/b>，浏览器从左往右找第一个有的。\n<b>最后一定写一个通用族<\/b>（<code>sans-serif<\/code> / <code>monospace<\/code>），\n保证一定落到某个字体。字体名<b>有空格要加引号<\/b>。<\/p>\n\n<h4>字号与粗细<\/h4>\n<div class=\"pv-wrap\" data-pv=\"2\" data-pv-kind=\"css\"><div class=\"code-wrap\"><div class=\"bar\"><span class=\"dot r\"><\/span><span class=\"dot y\"><\/span><span class=\"dot g\"><\/span><span class=\"name\">字号与粗细<\/span><span class=\"cp\">复制<\/span><\/div><pre>.s1 {\n    font-size: 13px;\n}\n\n.s2 {\n    font-size: 16px;\n}\n\n.s3 {\n    font-size: 22px;\n}\n\n.w3 {\n    font-weight: 300;\n}\n\n.w7 {\n    font-weight: 700;\n}\n\n.w9 {\n    font-weight: 900;\n}<\/pre><\/div><div class=\"pv-frame\"><div class=\"pv-cap\">字号与粗细<\/div><div class=\"pv-body\"><p class=\"s1\">13px 小字<\/p><p class=\"s2\">16px 正文（默认）<\/p><p class=\"s3\">22px 大字<\/p><p class=\"w3\">font-weight: 300 细<\/p><p class=\"w7\">font-weight: 700 粗<\/p><p class=\"w9\">font-weight: 900 更粗<\/p><\/div><\/div><\/div>\n<table>\n<thead><tr><th style=\"width:22%\">属性<\/th><th>常用值<\/th><\/tr><\/thead>\n<tbody>\n<tr><td class=\"c\">font-size<\/td><td class=\"c\">16px　1.2rem　120%<\/td><\/tr>\n<tr><td class=\"c\">font-weight<\/td><td class=\"c\">400 正常　700 粗　100~900<\/td><\/tr>\n<tr><td class=\"c\">font-style<\/td><td class=\"c\">normal　italic<\/td><\/tr>\n<\/tbody>\n<\/table>\n\n<h4>行高 line-height —— 比字号更影响可读性<\/h4>\n<div class=\"pv-wrap\" data-pv=\"3\" data-pv-kind=\"css\"><div class=\"code-wrap\"><div class=\"bar\"><span class=\"dot r\"><\/span><span class=\"dot y\"><\/span><span class=\"dot g\"><\/span><span class=\"name\">行高 line-height —— 同一个字号，不同行高<\/span><span class=\"cp\">复制<\/span><\/div><pre><span class=\"hl-c\">/* 无单位 = 字号的倍数，推荐写法 */<\/span>\n\n.lh1 {\n    line-height: 1.1;\n    background: #f2f6fb;\n}\n\n.lh2 {\n    line-height: 1.8;\n    background: #e7f6ee;\n}\n\n.lh3 {\n    line-height: 2.6;\n    background: #fdf4e3;\n}<\/pre><\/div><div class=\"pv-frame\"><div class=\"pv-cap\">行高 line-height —— 同一个字号，不同行高<\/div><div class=\"pv-body\"><p class=\"lh1\">行高 1.1：这几行会挤在一起，读起来很累。行高太小是排版里最常见的毛病之一。<\/p><p class=\"lh2\">行高 1.8：正文最舒服的区间，本系列文档正文用的就是这个值。<\/p><p class=\"lh3\">行高 2.6：太松了，行与行的关系变弱，适合诗句或需要留白的场合。<\/p><\/div><\/div><\/div>\n<div class=\"card key\">\n  <div class=\"card-t\">为什么不写单位<\/div>\n  <p><code>line-height: 1.8<\/code> 表示「行高 = 当前字号的 1.8 倍」。<\/p>\n  <p>写成 <code>28.8px<\/code> 的话，字号一变行高就不匹配了。\n  写成倍数，<b>字号怎么变行高都跟着变<\/b>。<\/p>\n  <p>正文 <b>1.6~1.8<\/b> 最舒服；标题 1.3 左右。<\/p>\n<\/div>\n\n<h4>字间距 letter-spacing<\/h4>\n<div class=\"pv-wrap\" data-pv=\"4\" data-pv-kind=\"css\"><div class=\"code-wrap\"><div class=\"bar\"><span class=\"dot r\"><\/span><span class=\"dot y\"><\/span><span class=\"dot g\"><\/span><span class=\"name\">字间距 letter-spacing<\/span><span class=\"cp\">复制<\/span><\/div><pre>.ls1 {\n    letter-spacing: 0;\n}\n\n.ls2 {\n    letter-spacing: .08em;\n}\n\n.ls3 {\n    letter-spacing: .28em;\n    text-transform: uppercase;\n    font-size: 13px;\n    font-weight: 700;\n}<\/pre><\/div><div class=\"pv-frame\"><div class=\"pv-cap\">字间距 letter-spacing<\/div><div class=\"pv-body\"><p class=\"ls1\">正常字间距 ABCDEFG<\/p><p class=\"ls2\">加宽一点 ABCDEFG<\/p><p class=\"ls3\">很宽 ABCDEFG<\/p><\/div><\/div><\/div>\n<table>\n<thead><tr><th style=\"width:26%\">字号单位<\/th><th>相对谁<\/th><\/tr><\/thead>\n<tbody>\n<tr><td class=\"c\">px<\/td><td>绝对，最好理解<\/td><\/tr>\n<tr><td class=\"c\">em<\/td><td><b>父元素<\/b>字号，会层层累积<\/td><\/tr>\n<tr><td class=\"c\">rem<\/td><td><span class=\"tag g\">推荐<\/span>\n    <b>根元素<\/b>字号，改一处全站缩放<\/td><\/tr>\n<\/tbody>\n<\/table>\n\n<h2 id=\"s6\"><span class=\"n\">6<\/span>背景与文字颜色<\/h2>\n\n<h4>文字颜色 <code>color<\/code><\/h4>\n<div class=\"pv-wrap\" data-pv=\"5\" data-pv-kind=\"css\"><div class=\"code-wrap\"><div class=\"bar\"><span class=\"dot r\"><\/span><span class=\"dot y\"><\/span><span class=\"dot g\"><\/span><span class=\"name\">文字颜色 color<\/span><span class=\"cp\">复制<\/span><\/div><pre><span class=\"hl-c\">/* 注意：文字颜色就叫 color，不是 font-color */<\/span>\n\n.c1 {\n    color: #1a1f28;\n}\n\n.c2 {\n    color: #1f6feb;\n}\n\n.c3 {\n    color: #c0392b;\n}\n\n.c4 {\n    color: #17864a;\n}\n\n.c5 {\n    color: #8b95a5;\n}<\/pre><\/div><div class=\"pv-frame\"><div class=\"pv-cap\">文字颜色 color<\/div><div class=\"pv-body\"><p class=\"c1\">#1a1f28 近黑 —— 正文就该用这个<\/p><p class=\"c2\">#1f6feb 蓝 —— 链接、强调<\/p><p class=\"c3\">#c0392b 红 —— 错误、危险<\/p><p class=\"c4\">#17864a 绿 —— 成功<\/p><p class=\"c5\">#8b95a5 灰 —— 辅助说明<\/p><\/div><\/div><\/div>\n<div class=\"card warn\">\n  <div class=\"card-t\">新手最常写错的属性名<\/div>\n  <pre style=\"background:#0b1220;border:1px solid #33486b;border-radius:8px;padding:10px 12px;font-family:var(--mono);font-size:12.5px;color:#f8fbff;overflow:auto\">font-color: red;        ❌ 没有这个属性\ntext-color: red;        ❌ 没有这个属性\ncolor: red;             ✅ 文字颜色就是 color\n                        （从「墨水的颜色」这个角度命名的）<\/pre>\n<\/div>\n\n<h4>背景色 background-color<\/h4>\n<div class=\"pv-wrap\" data-pv=\"6\" data-pv-kind=\"css\"><div class=\"code-wrap\"><div class=\"bar\"><span class=\"dot r\"><\/span><span class=\"dot y\"><\/span><span class=\"dot g\"><\/span><span class=\"name\">背景色 background-color<\/span><span class=\"cp\">复制<\/span><\/div><pre>.b1 {\n    background: #f7f9fc;\n    padding: 8px 12px;\n    border-radius: 6px;\n}\n\n.b2 {\n    background: #e8f1fe;\n    padding: 8px 12px;\n    border-radius: 6px;\n}\n\n.b3 {\n    background: #1a1f28;\n    color: #fff;\n    padding: 8px 12px;\n    border-radius: 6px;\n}\n\n.b4 {\n    background: rgba(31,111,235,.08);\n    padding: 8px 12px;\n    border-radius: 6px;\n}<\/pre><\/div><div class=\"pv-frame\"><div class=\"pv-cap\">背景色 background-color<\/div><div class=\"pv-body\"><p class=\"b1\">#f7f9fc 浅灰底<\/p><p class=\"b2\">#e8f1fe 浅蓝底<\/p><p class=\"b3\">深底浅字<\/p><p class=\"b4\">rgba 半透明底（叠在什么背景上都自然）<\/p><\/div><\/div><\/div>\n\n<h4>渐变背景 linear-gradient<\/h4>\n<div class=\"pv-wrap\" data-pv=\"7\" data-pv-kind=\"css\"><div class=\"code-wrap\"><div class=\"bar\"><span class=\"dot r\"><\/span><span class=\"dot y\"><\/span><span class=\"dot g\"><\/span><span class=\"name\">渐变背景 linear-gradient<\/span><span class=\"cp\">复制<\/span><\/div><pre><span class=\"hl-c\">/* 135deg = 从左上到右下 */<\/span>\n\n.g1 {\n    background: linear-gradient(135deg,#fffdf5,#fdf3dc);\n}\n\n.g2 {\n    background: linear-gradient(135deg,#1f6feb,#6b46c1);\n    color: #fff;\n}\n\n.g3 {\n    background: linear-gradient(90deg,#c9f0d8,#e8f1fe,#ffd9d4);\n}\n\n.g1,.g2,.g3 {\n    padding: 14px 16px;\n    border-radius: 8px;\n    margin: 6px 0;\n}<\/pre><\/div><div class=\"pv-frame\"><div class=\"pv-cap\">渐变背景 linear-gradient<\/div><div class=\"pv-body\"><div class=\"g1\">暖色渐变（导航页的星标卡片用的就是这个）<\/div><div class=\"g2\">蓝紫渐变 + 白字<\/div><div class=\"g3\">横向三色渐变<\/div><\/div><\/div><\/div>\n\n<h2 id=\"s7\"><span class=\"n\">7<\/span>文字装饰：text-decoration / text-shadow<\/h2>\n\n<h4>text-decoration 五种值<\/h4>\n<div class=\"pv-wrap\" data-pv=\"8\" data-pv-kind=\"css\"><div class=\"code-wrap\"><div class=\"bar\"><span class=\"dot r\"><\/span><span class=\"dot y\"><\/span><span class=\"dot g\"><\/span><span class=\"name\">text-decoration 五种值<\/span><span class=\"cp\">复制<\/span><\/div><pre>.d1 {\n    text-decoration: underline;\n}\n\n.d2 {\n    text-decoration: line-through;\n}\n\n.d3 {\n    text-decoration: overline;\n}\n\n.d4 {\n    text-decoration: underline dotted #c0392b;\n}\n\n.d5 {\n    text-decoration: underline wavy #1f6feb;\n}<\/pre><\/div><div class=\"pv-frame\"><div class=\"pv-cap\">text-decoration 五种值<\/div><div class=\"pv-body\"><p class=\"d1\">underline 下划线<\/p><p class=\"d2\">line-through 删除线<\/p><p class=\"d3\">overline 上划线<\/p><p class=\"d4\">虚线下划线 + 指定颜色<\/p><p class=\"d5\">波浪线 wavy<\/p><\/div><\/div><\/div>\n\n<h4>最常用的其实是 <code>none<\/code> —— 去掉链接下划线<\/h4>\n<div class=\"pv-wrap\" data-pv=\"9\" data-pv-kind=\"css\"><div class=\"code-wrap\"><div class=\"bar\"><span class=\"dot r\"><\/span><span class=\"dot y\"><\/span><span class=\"dot g\"><\/span><span class=\"name\">去掉链接下划线（导航菜单起手式）<\/span><span class=\"cp\">复制<\/span><\/div><pre>a.nav-link {\n    display: inline-block;\n    margin: 4px 8px 4px 0;\n    padding: 4px 12px;\n    border-radius: 6px;\n    text-decoration: none;\n    color: #4b5563;\n    transition: background .15s,color .15s;\n}\n\na.nav-link:hover {\n    background: #e8f1fe;\n    color: #1f6feb;\n}<\/pre><\/div><div class=\"pv-frame\"><div class=\"pv-cap\">去掉链接下划线（导航菜单起手式）<\/div><div class=\"pv-body\"><a class=\"nav-link\" href=\"#\">首页<\/a><a class=\"nav-link\" href=\"#\">教程<\/a><a class=\"nav-link\" href=\"#\">关于<\/a><p style=\"font-size:13px;color:#8b95a5;margin-top:6px\">鼠标移上去试试：没有下划线，靠底色变化表示悬停。<\/p><\/div><\/div><\/div>\n\n<h4>text-shadow 文字阴影<\/h4>\n<div class=\"pv-wrap\" data-pv=\"10\" data-pv-kind=\"css\"><div class=\"code-wrap\"><div class=\"bar\"><span class=\"dot r\"><\/span><span class=\"dot y\"><\/span><span class=\"dot g\"><\/span><span class=\"name\">text-shadow 文字阴影（四段式）<\/span><span class=\"cp\">复制<\/span><\/div><pre><span class=\"hl-c\">/* 水平偏移  垂直偏移  模糊  颜色 */<\/span>\n\n.ts1 {\n    text-shadow: 0 1px 2px rgba(0,0,0,.35);\n}\n\n.ts2 {\n    text-shadow: 0 0 10px #1f6feb;\n    font-weight: 700;\n    color: #1f6feb;\n}\n\n.ts3 {\n    text-shadow: 2px 2px 0 #c0392b;\n    font-weight: 700;\n}\n\n.ts4 {\n    text-shadow: -1px -1px 0 #fff,1px 1px 0 #fff;\n    font-weight: 700;\n    color: #1f6feb;\n}\n\n.ts5 {\n    text-shadow: 0 2px 6px rgba(0,0,0,.6);\n}\n\n.ts5,.ts1,.ts2,.ts3,.ts4 {\n    font-size: 19px;\n    margin: 12px 0;\n}\n\n.dark {\n    background: #1a1f28;\n    padding: 14px 16px;\n    border-radius: 8px;\n}\n\n.dark p {\n    color: #fff;\n    margin: 8px 0;\n}<\/pre><\/div><div class=\"pv-frame\"><div class=\"pv-cap\">text-shadow 文字阴影（四段式）<\/div><div class=\"pv-body\"><p class=\"ts1\">轻微浮起（最实用）<\/p><p class=\"ts2\">发光（偏移 0，只有模糊）<\/p><p class=\"ts3\">硬阴影（复古感）<\/p><p class=\"ts4\">白描边（偏移不模糊）<\/p><div class=\"dark\"><p class=\"ts5\">深色底上的文字加阴影，读起来更清楚<\/p><\/div><\/div><\/div><\/div>\n<div class=\"card key\">\n  <div class=\"card-t\">四个参数怎么读<\/div>\n  <pre style=\"background:#0b1220;border:1px solid #33486b;border-radius:8px;padding:10px 12px;font-family:var(--mono);font-size:12.5px;color:#f8fbff;overflow:auto\">text-shadow: 2px 2px 4px rgba(0,0,0,.4);\n             └┬┘ └┬┘ └┬┘ └──────┬──────┘\n              │   │   │         └─ 颜色（含透明度）\n              │   │   └─ 模糊半径，越大越糊\n              │   └─ 垂直偏移（正数往下）\n              └─ 水平偏移（正数往右）<\/pre>\n  <p style=\"margin-top:10px\"><b>偏移小、模糊大<\/b> = 柔和（推荐）；\n  <b>偏移大、模糊 0<\/b> = 生硬。<\/p>\n<\/div>\n\n<h2 id=\"s8\"><span class=\"n\">8<\/span>鼠标光标：cursor<\/h2>\n\n<div class=\"pv-wrap\" data-pv=\"11\" data-pv-kind=\"css\"><div class=\"code-wrap\"><div class=\"bar\"><span class=\"dot r\"><\/span><span class=\"dot y\"><\/span><span class=\"dot g\"><\/span><span class=\"name\">cursor 常用值 —— 把鼠标移到每一行上<\/span><span class=\"cp\">复制<\/span><\/div><pre>.cu {\n    display: inline-block;\n    min-width: 150px;\n    margin: 3px 8px 3px 0;\n    padding: 6px 12px;\n    background: #f2f6fb;\n    border: 1px solid #ccd5e3;\n    border-radius: 6px;\n    font-family: Consolas,monospace;\n    font-size: 13px;\n}\n\n.cu1 {\n    cursor: pointer;\n}\n\n.cu2 {\n    cursor: default;\n}\n\n.cu3 {\n    cursor: text;\n}\n\n.cu4 {\n    cursor: move;\n}\n\n.cu5 {\n    cursor: not-allowed;\n}\n\n.cu6 {\n    cursor: grab;\n}\n\n.cu7 {\n    cursor: help;\n}\n\n.cu8 {\n    cursor: wait;\n}\n\n.cu9 {\n    cursor: crosshair;\n}<\/pre><\/div><div class=\"pv-frame\"><div class=\"pv-cap\">cursor 常用值 —— 把鼠标移到每一行上<\/div><div class=\"pv-body\"><span class=\"cu cu1\">pointer 手形<\/span><span class=\"cu cu2\">default 箭头<\/span><span class=\"cu cu3\">text 文本竖线<\/span><span class=\"cu cu4\">move 移动<\/span><span class=\"cu cu5\">not-allowed 禁止<\/span><span class=\"cu cu6\">grab 可抓取<\/span><span class=\"cu cu7\">help 帮助<\/span><span class=\"cu cu8\">wait 忙<\/span><span class=\"cu cu9\">crosshair 十字<\/span><\/div><\/div><\/div>\n\n<div class=\"card key\">\n  <div class=\"card-t\"><code>pointer<\/code> 这个名字的坑<\/div>\n  <p>它<b>不是<\/b>「指针箭头」的意思 ——\n  它指的是「<b>手形<\/b>」（像指着东西的手指）。<\/p>\n  <p>想要普通箭头是 <code>default<\/code>。\n  <b>很多人第一次都写反了。<\/b><\/p>\n<\/div>\n\n<div class=\"pv-wrap\" data-pv=\"12\" data-pv-kind=\"css\"><div class=\"code-wrap\"><div class=\"bar\"><span class=\"dot r\"><\/span><span class=\"dot y\"><\/span><span class=\"dot g\"><\/span><span class=\"name\">把 div 做成可点击的样子（四件套）<\/span><span class=\"cp\">复制<\/span><\/div><pre>/* 浏览器只给 <span class=\"hl-p\">&lt;a&gt;<\/span> 和 <span class=\"hl-p\">&lt;button&gt;<\/span> 自动加手形，\n   自己做的「假按钮」要手动补齐这四件事 */\n\n.my-btn {\n    cursor: pointer;\n    <span class=\"hl-c\">/* ① 手形 */<\/span>\n  background: #1f6feb;\n    color: #fff;\n    <span class=\"hl-c\">/* ② 看起来是个按钮 */<\/span>\n  padding: 9px 20px;\n    border-radius: 8px;\n    <span class=\"hl-c\">/* ③ 圆角 */<\/span>\n  transition: background .15s;\n    <span class=\"hl-c\">/* ④ 悬停有反馈 */<\/span>\n  display: inline-block;\n}\n\n.my-btn:hover {\n    background: #1558b8;\n}<\/pre><\/div><div class=\"pv-frame\"><div class=\"pv-cap\">把 div 做成可点击的样子（四件套）<\/div><div class=\"pv-body\"><span class=\"my-btn\">假按钮（其实是 span）<\/span><p style=\"font-size:13px;color:#8b95a5;margin-top:8px\">它没有 href，但因为补了 cursor:pointer，鼠标移上去仍然是手形 —— 用户才知道这里能点。<\/p><\/div><\/div><\/div>\n\n<h2 id=\"s9\"><span class=\"n\">9<\/span>优先级与继承<\/h2>\n\n<h4>多条规则冲突时谁赢<\/h4>\n<table>\n<thead><tr><th style=\"width:34%\">来源<\/th><th style=\"width:16%\">权重<\/th><th>说明<\/th><\/tr><\/thead>\n<tbody>\n<tr><td class=\"c\">行内 style=\"...\"<\/td><td>最高<\/td><td>直接写在标签上，几乎总能赢<\/td><\/tr>\n<tr><td class=\"c\">#id<\/td><td>高<\/td><td>100<\/td><\/tr>\n<tr><td class=\"c\">.class / :hover / [attr]<\/td><td>中<\/td><td>10<\/td><\/tr>\n<tr><td class=\"c\">标签名 p / div<\/td><td>低<\/td><td>1<\/td><\/tr>\n<tr><td class=\"c\">*<\/td><td>最低<\/td><td>0<\/td><\/tr>\n<\/tbody>\n<\/table>\n\n<div class=\"card key\">\n  <div class=\"card-t\">三句话记住<\/div>\n  <ol>\n    <li><b>越具体越赢<\/b>：<code>#id<\/code> &gt; <code>.class<\/code> &gt; <code>标签<\/code><\/li>\n    <li><b>同样具体时，后写的赢<\/b><\/li>\n    <li><b>行内样式基本无敌<\/b> —— 所以尽量别用<\/li>\n  <\/ol>\n  <p><b>实用建议<\/b>：不要为了「赢」而堆选择器\n  （<code>#a .b div p<\/code> 这种）—— 那是维护的噩梦。\n  <b>把 class 用对，就不需要斗优先级。<\/b><\/p>\n<\/div>\n\n<h4>继承：有些属性会「传下去」<\/h4>\n<div class=\"code-wrap\"><div class=\"bar\"><span class=\"dot r\"><\/span><span class=\"dot y\"><\/span><span class=\"dot g\"><\/span><span class=\"name\">继承的效果<\/span><span class=\"cp\">复制<\/span><\/div><pre>body {\n    <span class=\"hl-k\">font-family<\/span>: <span class=\"hl-s\">\"Microsoft YaHei\"<\/span>, sans-serif;\n    <span class=\"hl-k\">color<\/span>: <span class=\"hl-n\">#1a1f28<\/span>;\n}\n\n<span class=\"hl-c\">/* body 里所有元素都会自动用这个字体和颜色 ——\n   不需要给每个 p、每个 div 各写一遍 */<\/span><\/pre><\/div>\n\n<table>\n<thead><tr><th style=\"width:44%\">会继承的（文字相关）<\/th><th>不会继承的（盒子相关）<\/th><\/tr><\/thead>\n<tbody>\n<tr><td class=\"c\">font-*　color　line-height<\/td>\n    <td class=\"c\">background　border　padding　margin　width<\/td><\/tr>\n<tr><td class=\"c\">text-align　letter-spacing<\/td>\n    <td class=\"c\">display　position　box-shadow<\/td><\/tr>\n<\/tbody>\n<\/table>\n\n<p><b>规律<\/b>：<b>「文字长什么样」会继承，「盒子怎么摆」不会。<\/b>\n这也符合直觉 —— 字体自然是全篇统一，但每个盒子各管各的边距。<\/p>\n\n<h2 id=\"s10\"><span class=\"n\">10<\/span>一页速查<\/h2>\n\n<table>\n<thead><tr><th style=\"width:36%\">想做的事<\/th><th>写法<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>外部样式表<\/td><td class=\"c\">&lt;link rel=\"stylesheet\" href=\"x.css\"&gt;<\/td><\/tr>\n<tr><td>选中 class / id<\/td><td class=\"c\">.card { }　#head { }<\/td><\/tr>\n<tr><td>选中后代 / 同时选多个<\/td><td class=\"c\">.card p { }　h1, h2 { }<\/td><\/tr>\n<tr><td>悬停状态<\/td><td class=\"c\">.btn:hover { }<\/td><\/tr>\n<tr><td>注释<\/td><td class=\"c\">/* 注释 */<\/td><\/tr>\n<tr><td>字体<\/td><td class=\"c\">font-family: \"Consolas\", monospace;<\/td><\/tr>\n<tr><td>字号 / 粗细<\/td><td class=\"c\">font-size: 16px;　font-weight: 700;<\/td><\/tr>\n<tr><td>行高（倍数）<\/td><td class=\"c\">line-height: 1.8;<\/td><\/tr>\n<tr><td>字间距<\/td><td class=\"c\">letter-spacing: 0.02em;<\/td><\/tr>\n<tr><td>文字色<\/td><td class=\"c\">color: #1a1f28;<\/td><\/tr>\n<tr><td>背景色 / 渐变<\/td>\n    <td class=\"c\">background-color: #f7f9fc;　background: linear-gradient(…);<\/td><\/tr>\n<tr><td>去链接下划线<\/td><td class=\"c\">text-decoration: none;<\/td><\/tr>\n<tr><td>删除线 / 波浪线<\/td>\n    <td class=\"c\">line-through　underline wavy #1f6feb<\/td><\/tr>\n<tr><td>文字阴影<\/td><td class=\"c\">text-shadow: 0 1px 2px rgba(0,0,0,.3);<\/td><\/tr>\n<tr><td>手形光标<\/td><td class=\"c\">cursor: pointer;<\/td><\/tr>\n<tr><td>禁止光标<\/td><td class=\"c\">cursor: not-allowed;<\/td><\/tr>\n<\/tbody>\n<\/table>\n\n<div class=\"card key\">\n  <div class=\"card-t\">这一篇要记住的五句话<\/div>\n  <ol>\n    <li><b>CSS = 选中谁 + 把它怎么样<\/b>：\n      <code>选择器 { 属性: 值; }<\/code>，冒号不是等号，末尾要分号。<\/li>\n    <li><b>九成时间用 <code>.class<\/code> 选<\/b>；\n      行内样式优先级最高但最难维护，别用。<\/li>\n    <li><b><code>font-family<\/code> 写一串候选<\/b>，最后兜一个\n      <code>sans-serif<\/code> / <code>monospace<\/code>；\n      <b><code>line-height<\/code> 不写单位<\/b>（写倍数）。<\/li>\n    <li><b>文字色是 <code>color<\/code><\/b>（不是 <code>font-color<\/code>）；\n      <code>cursor: pointer<\/code> 是<b>手形<\/b>，不是箭头。<\/li>\n    <li><b>文字属性会继承、盒子属性不会<\/b>；\n      同样具体时<b>后写的赢<\/b>。<\/li>\n  <\/ol>\n<\/div>","series":[{"file":"fe-01.html","num":"FE-01","title":"HTML 入门与标签语法","star":false},{"file":"fe-02.html","num":"FE-02","title":"HTML 常用标签","star":false},{"file":"fe-03-F01.html","num":"FE-03-F01","title":"十六进制颜色模型、HSV 与 Alpha","star":true},{"file":"fe-03.html","num":"FE-03","title":"CSS 入门","star":false},{"file":"fe-04.html","num":"FE-04","title":"CSS 选择器语法","star":true},{"file":"fe-05.html","num":"FE-05","title":"Display 与盒模型尺寸","star":false},{"file":"fe-06.html","num":"FE-06","title":"Writing Mode 与溢出滚动","star":true},{"file":"fe-07.html","num":"FE-07","title":"鼠标悬停与 transition","star":false}]};
