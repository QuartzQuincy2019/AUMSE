window.__FE_PAGE__ = {"file":"fe-04.html","num":"FE-04","title":"CSS 选择器语法","star":false,"body":"<p><span class=\"lang css\">CSS<\/span><\/p>\n\n<div class=\"card note\">\n  <div class=\"card-t\">这一篇讲什么<\/div>\n  <p><b>选择器 = 「选中谁」<\/b>。CSS 的前半句。<\/p>\n  <p>下面每一条都是<b>一句话 + 代码 + 示例展示<\/b>，\n  示例框里的高亮段落就是被选中的那个。<\/p>\n  <p><b>本页所有示例共用同一段 HTML<\/b>，方便对照不同选择器的作用范围：<\/p>\n  <pre style=\"background:#0b1220;border:1px solid #33486b;border-radius:8px;padding:10px 12px;font-family:var(--mono);font-size:12.5px;color:#f8fbff;overflow:auto\">&lt;div class=\"box\"&gt;\n  &lt;p&gt;第一段&lt;/p&gt;\n  &lt;p class=\"hi\"&gt;第二段（class=\"hi\"）&lt;/p&gt;\n  &lt;p data-t=\"uniq\"&gt;第三段&lt;/p&gt;\n  &lt;p&gt;第四段&lt;/p&gt;\n&lt;/div&gt;<\/pre>\n<\/div>\n\n<h2 id=\"s1\"><span class=\"n\">1<\/span>选择器是什么<\/h2>\n\n<p>CSS 规则的形状固定为 <b>选择器 + 声明块<\/b>：<\/p>\n\n<div class=\"code-wrap\"><div class=\"bar\"><span class=\"dot r\"><\/span><span class=\"dot y\"><\/span><span class=\"dot g\"><\/span><span class=\"name\">结构<\/span><span class=\"cp\">复制<\/span><\/div><pre><span class=\"hl-p\">选择器<\/span> {\n    属性: 值;\n}<\/pre><\/div>\n\n<p>选择器写错了，CSS <b>不报错<\/b> —— 那条规则只是不生效。所以这一篇值得记牢。<\/p>\n\n<h2 id=\"s2\"><span class=\"n\">2<\/span>基本选择器<\/h2>\n\n<h4>标签选择器 —— 选中所有该标签<\/h4>\n<div class=\"pv-wrap\" data-pv=\"1\" data-pv-kind=\"css\"><div class=\"code-wrap\"><div class=\"bar\"><span class=\"dot r\"><\/span><span class=\"dot y\"><\/span><span class=\"dot g\"><\/span><span class=\"name\">标签选择器<\/span><span class=\"cp\">复制<\/span><\/div><pre><span class=\"hl-c\">/* 选中上面那 4 个 p */<\/span>\n\np {\n    background: #ffe9a8;\n}<\/pre><\/div><div class=\"pv-frame\"><div class=\"pv-cap\">标签选择器<\/div><div class=\"pv-body\"><div class=\"box\">\n  <p>第一段<\/p>\n  <p class=\"hi\">第二段（class=\"hi\"）<\/p>\n  <p data-t=\"uniq\">第三段（这一段被 #uniq 选中）<\/p>\n  <p>第四段<\/p>\n<\/div><\/div><\/div><\/div>\n\n<h4>类选择器 <code>.名字<\/code> —— 选中 class 含它的元素（最常用）<\/h4>\n<div class=\"pv-wrap\" data-pv=\"2\" data-pv-kind=\"css\"><div class=\"code-wrap\"><div class=\"bar\"><span class=\"dot r\"><\/span><span class=\"dot y\"><\/span><span class=\"dot g\"><\/span><span class=\"name\">类选择器<\/span><span class=\"cp\">复制<\/span><\/div><pre><span class=\"hl-c\">/* 只有 class=\"hi\" 的那一个 */<\/span>\n\n.hi {\n    background: #c9f0d8;\n}<\/pre><\/div><div class=\"pv-frame\"><div class=\"pv-cap\">类选择器<\/div><div class=\"pv-body\"><div class=\"box\">\n  <p>第一段<\/p>\n  <p class=\"hi\">第二段（class=\"hi\"）<\/p>\n  <p data-t=\"uniq\">第三段（这一段被 #uniq 选中）<\/p>\n  <p>第四段<\/p>\n<\/div><\/div><\/div><\/div>\n\n<h4>id 选择器 <code>#名字<\/code> —— 选中唯一那一个<\/h4>\n<div class=\"pv-wrap\" data-pv=\"3\" data-pv-kind=\"css\"><div class=\"code-wrap\"><div class=\"bar\"><span class=\"dot r\"><\/span><span class=\"dot y\"><\/span><span class=\"dot g\"><\/span><span class=\"name\">id 选择器<\/span><span class=\"cp\">复制<\/span><\/div><pre><span class=\"hl-c\">/* 只有带这个标记的那一个 */<\/span>\n\n[data-t=\"uniq\"] {\n    background: #d8e6ff;\n}<\/pre><\/div><div class=\"pv-frame\"><div class=\"pv-cap\">id 选择器<\/div><div class=\"pv-body\"><div class=\"box\">\n  <p>第一段<\/p>\n  <p class=\"hi\">第二段（class=\"hi\"）<\/p>\n  <p data-t=\"uniq\">第三段（这一段被 #uniq 选中）<\/p>\n  <p>第四段<\/p>\n<\/div><\/div><\/div><\/div>\n\n<h4>通配符 <code>*<\/code> —— 选中所有元素<\/h4>\n<div class=\"pv-wrap\" data-pv=\"4\" data-pv-kind=\"css\"><div class=\"code-wrap\"><div class=\"bar\"><span class=\"dot r\"><\/span><span class=\"dot y\"><\/span><span class=\"dot g\"><\/span><span class=\"name\">通配符<\/span><span class=\"cp\">复制<\/span><\/div><pre><span class=\"hl-c\">/* 框里所有元素加一圈虚线 */<\/span>\n\n* {\n    outline: 1px dashed #e08a2e;\n    outline-offset: 1px;\n}<\/pre><\/div><div class=\"pv-frame\"><div class=\"pv-cap\">通配符<\/div><div class=\"pv-body\"><div class=\"box\">\n  <p>第一段<\/p>\n  <p class=\"hi\">第二段（class=\"hi\"）<\/p>\n  <p data-t=\"uniq\">第三段（这一段被 #uniq 选中）<\/p>\n  <p>第四段<\/p>\n<\/div><\/div><\/div><\/div>\n\n<h2 id=\"s3\"><span class=\"n\">3<\/span>组合：并集与后代<\/h4>\n\n<h4>并集：逗号 —— 同时选中多种<\/h4>\n<div class=\"pv-wrap\" data-pv=\"5\" data-pv-kind=\"css\"><div class=\"code-wrap\"><div class=\"bar\"><span class=\"dot r\"><\/span><span class=\"dot y\"><\/span><span class=\"dot g\"><\/span><span class=\"name\">并集（逗号）<\/span><span class=\"cp\">复制<\/span><\/div><pre><span class=\"hl-c\">/* 逗号 = 或。这里两个都中 */<\/span>\n\n.hi, [data-t=\"uniq\"] {\n    background: #e6d8ff;\n}<\/pre><\/div><div class=\"pv-frame\"><div class=\"pv-cap\">并集（逗号）<\/div><div class=\"pv-body\"><div class=\"box\">\n  <p>第一段<\/p>\n  <p class=\"hi\">第二段（class=\"hi\"）<\/p>\n  <p data-t=\"uniq\">第三段（这一段被 #uniq 选中）<\/p>\n  <p>第四段<\/p>\n<\/div><\/div><\/div><\/div>\n\n<h4>后代：空格 —— 里面的所有层级<\/h4>\n<div class=\"pv-wrap\" data-pv=\"6\" data-pv-kind=\"css\"><div class=\"code-wrap\"><div class=\"bar\"><span class=\"dot r\"><\/span><span class=\"dot y\"><\/span><span class=\"dot g\"><\/span><span class=\"name\">后代（空格）<\/span><span class=\"cp\">复制<\/span><\/div><pre><span class=\"hl-c\">/* .box 里面的所有 p（含更深层级） */<\/span>\n\n.box p {\n    background: #ffd9d4;\n}<\/pre><\/div><div class=\"pv-frame\"><div class=\"pv-cap\">后代（空格）<\/div><div class=\"pv-body\"><div class=\"box\">\n  <p>第一段<\/p>\n  <p class=\"hi\">第二段（class=\"hi\"）<\/p>\n  <p data-t=\"uniq\">第三段（这一段被 #uniq 选中）<\/p>\n  <p>第四段<\/p>\n<\/div><\/div><\/div><\/div>\n\n<h4>直接子元素：<code>&gt;<\/code> —— 只要亲儿子，不含孙子<\/h4>\n<div class=\"pv-wrap\" data-pv=\"7\" data-pv-kind=\"css\"><div class=\"code-wrap\"><div class=\"bar\"><span class=\"dot r\"><\/span><span class=\"dot y\"><\/span><span class=\"dot g\"><\/span><span class=\"name\">直接子元素（&amp;gt;）<\/span><span class=\"cp\">复制<\/span><\/div><pre>.box &gt; p {\n    background: #cfe9ff;\n    border-left: 3px solid #1f6feb;\n}<\/pre><\/div><div class=\"pv-frame\"><div class=\"pv-cap\">直接子元素（&amp;gt;）<\/div><div class=\"pv-body\"><div class=\"box\">\n  <p>直接子元素（中）<\/p>\n  <div>\n    <p>孙子元素（不中，因为不是直接子元素）<\/p>\n  <\/div>\n<\/div><\/div><\/div><\/div>\n\n<h4>相邻兄弟：<code>+<\/code> —— 紧跟在后面的那一个<\/h4>\n<div class=\"pv-wrap\" data-pv=\"8\" data-pv-kind=\"css\"><div class=\"code-wrap\"><div class=\"bar\"><span class=\"dot r\"><\/span><span class=\"dot y\"><\/span><span class=\"dot g\"><\/span><span class=\"name\">相邻兄弟（+）<\/span><span class=\"cp\">复制<\/span><\/div><pre><span class=\"hl-c\">/* 紧跟在另一个 p 后面的 p（即第 2、3、4 个） */<\/span>\n\np + p {\n    background: #ffe0b3;\n}<\/pre><\/div><div class=\"pv-frame\"><div class=\"pv-cap\">相邻兄弟（+）<\/div><div class=\"pv-body\"><div class=\"box\">\n  <p>第一段<\/p>\n  <p class=\"hi\">第二段（class=\"hi\"）<\/p>\n  <p data-t=\"uniq\">第三段（这一段被 #uniq 选中）<\/p>\n  <p>第四段<\/p>\n<\/div><\/div><\/div><\/div>\n\n<h4>通用兄弟：<code>~<\/code> —— 后面所有同级<\/h4>\n<div class=\"pv-wrap\" data-pv=\"9\" data-pv-kind=\"css\"><div class=\"code-wrap\"><div class=\"bar\"><span class=\"dot r\"><\/span><span class=\"dot y\"><\/span><span class=\"dot g\"><\/span><span class=\"name\">通用兄弟（~）<\/span><span class=\"cp\">复制<\/span><\/div><pre><span class=\"hl-c\">/* .hi 后面所有同级 p */<\/span>\n\n.hi ~ p {\n    background: #c9f0d8;\n}<\/pre><\/div><div class=\"pv-frame\"><div class=\"pv-cap\">通用兄弟（~）<\/div><div class=\"pv-body\"><div class=\"box\">\n  <p>第一段<\/p>\n  <p class=\"hi\">第二段（class=\"hi\"）<\/p>\n  <p data-t=\"uniq\">第三段（这一段被 #uniq 选中）<\/p>\n  <p>第四段<\/p>\n<\/div><\/div><\/div><\/div>\n\n<h2 id=\"s4\"><span class=\"n\">4<\/span>属性限定 <code>[href=\"\"]<\/code><\/h2>\n\n<p>这一节很实用 —— <b>按属性挑元素<\/b>，尤其是链接。<\/p>\n\n<h4>有某个属性<\/h4>\n<div class=\"pv-wrap\" data-pv=\"10\" data-pv-kind=\"css\"><div class=\"code-wrap\"><div class=\"bar\"><span class=\"dot r\"><\/span><span class=\"dot y\"><\/span><span class=\"dot g\"><\/span><span class=\"name\">有某属性：[href]<\/span><span class=\"cp\">复制<\/span><\/div><pre><span class=\"hl-c\">/* 只要带 href 就中 */<\/span>\n\n.box [href] {\n    background: #ffe0b3;\n}<\/pre><\/div><div class=\"pv-frame\"><div class=\"pv-cap\">有某属性：[href]<\/div><div class=\"pv-body\"><div class=\"box\">\n  <a href=\"/local/page.html\">站内链接<\/a><br>\n  <a href=\"https://example.com\">外站链接 https<\/a><br>\n  <a href=\"report.pdf\">PDF 文件<\/a><br>\n  <a href=\"#top\">本页锚点<\/a><br>\n  <a>没有 href 的 a<\/a>\n<\/div><\/div><\/div><\/div>\n\n<h4>属性等于某值<\/h4>\n<div class=\"pv-wrap\" data-pv=\"11\" data-pv-kind=\"css\"><div class=\"code-wrap\"><div class=\"bar\"><span class=\"dot r\"><\/span><span class=\"dot y\"><\/span><span class=\"dot g\"><\/span><span class=\"name\">属性等于：[href=\"report.pdf\"]<\/span><span class=\"cp\">复制<\/span><\/div><pre><span class=\"hl-c\">/* 正好等于这个值 */<\/span>\n\n.box [href=\"report.pdf\"] {\n    background: #ffd9d4;\n    font-weight: 700;\n}<\/pre><\/div><div class=\"pv-frame\"><div class=\"pv-cap\">属性等于：[href=\"report.pdf\"]<\/div><div class=\"pv-body\"><div class=\"box\">\n  <a href=\"/local/page.html\">站内链接<\/a><br>\n  <a href=\"https://example.com\">外站链接 https<\/a><br>\n  <a href=\"report.pdf\">PDF 文件<\/a><br>\n  <a href=\"#top\">本页锚点<\/a><br>\n  <a>没有 href 的 a<\/a>\n<\/div><\/div><\/div><\/div>\n\n<h4>属性以某串开头 <code>^=<\/code><\/h4>\n<div class=\"pv-wrap\" data-pv=\"12\" data-pv-kind=\"css\"><div class=\"code-wrap\"><div class=\"bar\"><span class=\"dot r\"><\/span><span class=\"dot y\"><\/span><span class=\"dot g\"><\/span><span class=\"name\">以某串开头：[href^=\"https\"]<\/span><span class=\"cp\">复制<\/span><\/div><pre><span class=\"hl-c\">/* ^= 开头 */<\/span>\n\n.box [href^=\"https\"] {\n    background: #c9f0d8;\n    font-weight: 700;\n}<\/pre><\/div><div class=\"pv-frame\"><div class=\"pv-cap\">以某串开头：[href^=\"https\"]<\/div><div class=\"pv-body\"><div class=\"box\">\n  <a href=\"/local/page.html\">站内链接<\/a><br>\n  <a href=\"https://example.com\">外站链接 https<\/a><br>\n  <a href=\"report.pdf\">PDF 文件<\/a><br>\n  <a href=\"#top\">本页锚点<\/a><br>\n  <a>没有 href 的 a<\/a>\n<\/div><\/div><\/div><\/div>\n\n<h4>属性以某串结尾 <code>$=<\/code> —— 常用于挑文件类型<\/h4>\n<div class=\"pv-wrap\" data-pv=\"13\" data-pv-kind=\"css\"><div class=\"code-wrap\"><div class=\"bar\"><span class=\"dot r\"><\/span><span class=\"dot y\"><\/span><span class=\"dot g\"><\/span><span class=\"name\">以某串结尾：[href$=\".pdf\"]<\/span><span class=\"cp\">复制<\/span><\/div><pre><span class=\"hl-c\">/* $= 结尾 */<\/span>\n\n.box [href$=\".pdf\"] {\n    background: #e6d8ff;\n    font-weight: 700;\n}<\/pre><\/div><div class=\"pv-frame\"><div class=\"pv-cap\">以某串结尾：[href$=\".pdf\"]<\/div><div class=\"pv-body\"><div class=\"box\">\n  <a href=\"/local/page.html\">站内链接<\/a><br>\n  <a href=\"https://example.com\">外站链接 https<\/a><br>\n  <a href=\"report.pdf\">PDF 文件<\/a><br>\n  <a href=\"#top\">本页锚点<\/a><br>\n  <a>没有 href 的 a<\/a>\n<\/div><\/div><\/div><\/div>\n\n<h4>属性包含某串 <code>*=<\/code><\/h4>\n<div class=\"pv-wrap\" data-pv=\"14\" data-pv-kind=\"css\"><div class=\"code-wrap\"><div class=\"bar\"><span class=\"dot r\"><\/span><span class=\"dot y\"><\/span><span class=\"dot g\"><\/span><span class=\"name\">包含某串：[href*=\"ume\"]<\/span><span class=\"cp\">复制<\/span><\/div><pre><span class=\"hl-c\">/* *= 包含 */<\/span>\n\n.box [href*=\"ume\"] {\n    background: #cfe9ff;\n    font-weight: 700;\n}<\/pre><\/div><div class=\"pv-frame\"><div class=\"pv-cap\">包含某串：[href*=\"ume\"]<\/div><div class=\"pv-body\"><div class=\"box\">\n  <a href=\"/ume/about.html\">/ume/about.html<\/a><br>\n  <a href=\"/other/about.html\">/other/about.html<\/a>\n<\/div><\/div><\/div><\/div>\n\n<h4>更实用的例子：区分外链和锚点<\/h4>\n<div class=\"pv-wrap\" data-pv=\"15\" data-pv-kind=\"css\"><div class=\"code-wrap\"><div class=\"bar\"><span class=\"dot r\"><\/span><span class=\"dot y\"><\/span><span class=\"dot g\"><\/span><span class=\"name\">实战：外链自动加标记<\/span><span class=\"cp\">复制<\/span><\/div><pre><span class=\"hl-c\">/* 外链后面自动加一个 ↗ */<\/span>\n\n.box [href^=\"http\"]::after {\n    content: \" ↗\";\n    color: #1f6feb;\n    font-weight: 700;\n}\n\n<span class=\"hl-c\">/* 锚点链接换个底色 */<\/span>\n.box [href^=\"#\"] {\n    background: #e6d8ff;\n}<\/pre><\/div><div class=\"pv-frame\"><div class=\"pv-cap\">实战：外链自动加标记<\/div><div class=\"pv-body\"><div class=\"box\">\n  <a href=\"/local/page.html\">站内链接<\/a><br>\n  <a href=\"https://example.com\">外站链接 https<\/a><br>\n  <a href=\"report.pdf\">PDF 文件<\/a><br>\n  <a href=\"#top\">本页锚点<\/a><br>\n  <a>没有 href 的 a<\/a>\n<\/div><\/div><\/div><\/div>\n\n<h2 id=\"s5\"><span class=\"n\">5<\/span>伪类<\/h2>\n\n<p>伪类选中「<b>处在某种状态<\/b>」的元素，写法是 <code>:<\/code> + 状态名。<\/p>\n\n<h4>悬停 / 按下 / 聚焦<\/h4>\n<div class=\"pv-wrap\" data-pv=\"16\" data-pv-kind=\"css\"><div class=\"code-wrap\"><div class=\"bar\"><span class=\"dot r\"><\/span><span class=\"dot y\"><\/span><span class=\"dot g\"><\/span><span class=\"name\">悬停 / 按下 / 聚焦<\/span><span class=\"cp\">复制<\/span><\/div><pre>.btn:hover {\n    background: #1558b8;\n}\n\n.btn:active {\n    transform: scale(.95);\n}\n\n.inp:focus {\n    box-shadow: 0 0 0 3px rgba(31,111,235,.3);\n}<\/pre><\/div><div class=\"pv-frame\"><div class=\"pv-cap\">悬停 / 按下 / 聚焦<\/div><div class=\"pv-body\"><span class=\"btn\">鼠标移上来<\/span>\n<span class=\"btn\">按下去试试<\/span>\n<div><input class=\"inp\" placeholder=\"点这里获得焦点\"><\/div><\/div><\/div><\/div>\n<p><b>把鼠标移到上面试试。<\/b><\/p>\n\n<h4>结构伪类：第一个、最后一个、第 n 个<\/h4>\n<div class=\"pv-wrap\" data-pv=\"17\" data-pv-kind=\"css\"><div class=\"code-wrap\"><div class=\"bar\"><span class=\"dot r\"><\/span><span class=\"dot y\"><\/span><span class=\"dot g\"><\/span><span class=\"name\">:first-child / :last-child / :nth-child(3)<\/span><span class=\"cp\">复制<\/span><\/div><pre>.nl li:first-child {\n    background: #c9f0d8;\n    font-weight: 700;\n}\n\n.nl li:last-child {\n    background: #ffd9d4;\n    font-weight: 700;\n}\n\n.nl li:nth-child(3) {\n    background: #ffe0b3;\n    font-weight: 700;\n}<\/pre><\/div><div class=\"pv-frame\"><div class=\"pv-cap\">:first-child / :last-child / :nth-child(3)<\/div><div class=\"pv-body\"><ul class=\"nl\">\n  <li>第 1 项<\/li><li>第 2 项<\/li><li>第 3 项<\/li>\n  <li>第 4 项<\/li><li>第 5 项<\/li><li>第 6 项<\/li>\n<\/ul><\/div><\/div><\/div>\n\n<h4>表格斑马纹 —— <code>:nth-child(2n)<\/code> 最典型的用处<\/h4>\n<div class=\"pv-wrap\" data-pv=\"18\" data-pv-kind=\"css\"><div class=\"code-wrap\"><div class=\"bar\"><span class=\"dot r\"><\/span><span class=\"dot y\"><\/span><span class=\"dot g\"><\/span><span class=\"name\">斑马纹：tr:nth-child(2n)<\/span><span class=\"cp\">复制<\/span><\/div><pre><span class=\"hl-c\">/* 偶数行上浅灰底 */<\/span>\n\n.zt tr:nth-child(2n) {\n    background: #f7f9fc;\n}<\/pre><\/div><div class=\"pv-frame\"><div class=\"pv-cap\">斑马纹：tr:nth-child(2n)<\/div><div class=\"pv-body\"><table class=\"zt\">\n  <tr><th>名字<\/th><th>血量<\/th><\/tr>\n  <tr><td>Archer<\/td><td>100<\/td><\/tr>\n  <tr><td>Mage<\/td><td>80<\/td><\/tr>\n  <tr><td>Knight<\/td><td>150<\/td><\/tr>\n  <tr><td>Rogue<\/td><td>90<\/td><\/tr>\n<\/table><\/div><\/div><\/div>\n\n<h4>取反 <code>:not()<\/code><\/h4>\n<div class=\"pv-wrap\" data-pv=\"19\" data-pv-kind=\"css\"><div class=\"code-wrap\"><div class=\"bar\"><span class=\"dot r\"><\/span><span class=\"dot y\"><\/span><span class=\"dot g\"><\/span><span class=\"name\">取反：li:not(.on)<\/span><span class=\"cp\">复制<\/span><\/div><pre>.nl li:not(.on) {\n    color: #8b95a5;\n    text-decoration: line-through;\n}\n\n.nl li.on {\n    background: #c9f0d8;\n    font-weight: 700;\n}<\/pre><\/div><div class=\"pv-frame\"><div class=\"pv-cap\">取反：li:not(.on)<\/div><div class=\"pv-body\"><ul class=\"nl\">\n  <li class=\"on\">这一项是 .on（保留）<\/li>\n  <li>没有 .on，被划掉<\/li>\n  <li>没有 .on，被划掉<\/li>\n<\/ul><\/div><\/div><\/div>\n\n<h2 id=\"s6\"><span class=\"n\">6<\/span>伪元素<\/h2>\n\n<p>伪元素用 <code>::<\/code>（两个冒号），选中的是<b>元素的一部分<\/b>，\n或者<b>凭空造一个<\/b>。<\/p>\n\n<h4>首字放大 / 首行<\/h4>\n<div class=\"pv-wrap\" data-pv=\"20\" data-pv-kind=\"css\"><div class=\"code-wrap\"><div class=\"bar\"><span class=\"dot r\"><\/span><span class=\"dot y\"><\/span><span class=\"dot g\"><\/span><span class=\"name\">首字放大：p::first-letter<\/span><span class=\"cp\">复制<\/span><\/div><pre>.fx::first-letter {\n    font-size: 34px;\n    font-weight: 700;\n    color: #1f6feb;\n    float: left;\n    line-height: 1;\n    margin: 2px 8px 0 0;\n}<\/pre><\/div><div class=\"pv-frame\"><div class=\"pv-cap\">首字放大：p::first-letter<\/div><div class=\"pv-body\"><p class=\"fx\">这一段的第一个字会被放大。首字下沉是排版里很常见的手法，用一条 ::first-letter 就能做到。<\/p><\/div><\/div><\/div>\n\n<h4>前后插入内容 <code>::before<\/code> / <code>::after<\/code><\/h4>\n<div class=\"pv-wrap\" data-pv=\"21\" data-pv-kind=\"css\"><div class=\"code-wrap\"><div class=\"bar\"><span class=\"dot r\"><\/span><span class=\"dot y\"><\/span><span class=\"dot g\"><\/span><span class=\"name\">前后插入：::before / ::after<\/span><span class=\"cp\">复制<\/span><\/div><pre>.tagp::before {\n    content: \"● \";\n    color: #17864a;\n}\n\n.li2::after {\n    content: \"（已完成）\";\n    color: #17864a;\n    font-size: 12px;\n    margin-left: 6px;\n}<\/pre><\/div><div class=\"pv-frame\"><div class=\"pv-cap\">前后插入：::before / ::after<\/div><div class=\"pv-body\"><span class=\"tagp\">带圆点的标签<\/span>\n<div class=\"li2\">任务一<\/div>\n<div class=\"li2\">任务二<\/div><\/div><\/div><\/div>\n<p><b><code>content<\/code> 不能省<\/b>，哪怕写空字符串。忘了它伪元素就不出现。<\/p>\n\n<h4>选中文字的颜色 <code>::selection<\/code><\/h4>\n<div class=\"pv-wrap\" data-pv=\"22\" data-pv-kind=\"css\"><div class=\"code-wrap\"><div class=\"bar\"><span class=\"dot r\"><\/span><span class=\"dot y\"><\/span><span class=\"dot g\"><\/span><span class=\"name\">选中文字的颜色：::selection<\/span><span class=\"cp\">复制<\/span><\/div><pre><span class=\"hl-c\">/* 用鼠标拖选下面这段文字 */<\/span>\n\n.sel::selection {\n    background: #ffe0b3;\n    color: #8a5e0c;\n}<\/pre><\/div><div class=\"pv-frame\"><div class=\"pv-cap\">选中文字的颜色：::selection<\/div><div class=\"pv-body\"><p class=\"sel\">用鼠标拖选这一段文字，看到选中背景变成了暖黄色。::selection 就是干这个的。<\/p><\/div><\/div><\/div>\n\n<h2 id=\"s7\"><span class=\"n\">7<\/span>优先级速查<\/h4>\n\n<table>\n<thead><tr><th style=\"width:34%\">选择器<\/th><th style=\"width:16%\">权重<\/th><th>说明<\/th><\/tr><\/thead>\n<tbody>\n<tr><td class=\"c\">行内 style=\"\"<\/td><td>最高<\/td><td>几乎总能赢<\/td><\/tr>\n<tr><td class=\"c\">#id<\/td><td>100<\/td><td>越具体越赢<\/td><\/tr>\n<tr><td class=\"c\">.class　:hover　[attr]<\/td><td>10<\/td><td>同一档<\/td><\/tr>\n<tr><td class=\"c\">标签名　::before<\/td><td>1<\/td><td>最低<\/td><\/tr>\n<tr><td class=\"c\">*<\/td><td>0<\/td><td>不增加权重<\/td><\/tr>\n<\/tbody>\n<\/table>\n\n<div class=\"card key\">\n  <div class=\"card-t\">只用两句话<\/div>\n  <ol>\n    <li><b>越具体越赢<\/b>：<code>#id<\/code> &gt; <code>.class<\/code> &gt; <code>标签<\/code><\/li>\n    <li><b>同样具体时，后写的赢<\/b><\/li>\n  <\/ol>\n  <p>不要为了「赢」而把选择器堆得又长又深 ——\n  <b>把 class 用对，就不需要斗优先级。<\/b><\/p>\n<\/div>\n\n<h2 id=\"s8\"><span class=\"n\">8<\/span>一页速查<\/h2>\n\n<div class=\"pv-wrap\" data-pv=\"23\" data-pv-kind=\"css\"><div class=\"code-wrap\"><div class=\"bar\"><span class=\"dot r\"><\/span><span class=\"dot y\"><\/span><span class=\"dot g\"><\/span><span class=\"name\">一页速查的现场版<\/span><span class=\"cp\">复制<\/span><\/div><pre>.s8 p:nth-child(2n) {\n    background: #f2f6fb;\n}\n\n.s8 p:first-child {\n    background: #c9f0d8;\n}\n\n.s8 p:last-child {\n    background: #ffd9d4;\n}\n\n.s8 p:hover {\n    background: #ffe0b3;\n}<\/pre><\/div><div class=\"pv-frame\"><div class=\"pv-cap\">一页速查的现场版<\/div><div class=\"pv-body\"><div class=\"s8\"><p>第一个（:first-child 绿）<\/p><p>第二个（偶数行 :nth-child(2n) 灰）<\/p><p>第三个<\/p><p>第四个（偶数行）<\/p><p>最后一个（:last-child 红）<\/p><p>鼠标移到任意一行会变黄（:hover）<\/p><\/div><\/div><\/div><\/div>\n\n<table>\n<thead><tr><th style=\"width:34%\">写法<\/th><th>选中<\/th><\/tr><\/thead>\n<tbody>\n<tr><td class=\"c\">p<\/td><td>所有 <code>&lt;p&gt;<\/code><\/td><\/tr>\n<tr><td class=\"c\">.hi<\/td><td>class 含 hi 的<\/td><\/tr>\n<tr><td class=\"c\">#uniq<\/td><td>id 是 uniq 的那一个<\/td><\/tr>\n<tr><td class=\"c\">*<\/td><td>所有元素<\/td><\/tr>\n<tr><td class=\"c\">.a, .b<\/td><td>a <b>或<\/b> b<\/td><\/tr>\n<tr><td class=\"c\">.box p<\/td><td>.box 里的所有后代 p<\/td><\/tr>\n<tr><td class=\"c\">.box &gt; p<\/td><td>.box 的直接子元素 p<\/td><\/tr>\n<tr><td class=\"c\">p + p<\/td><td>紧跟在 p 后面的那个 p<\/td><\/tr>\n<tr><td class=\"c\">p ~ p<\/td><td>p 后面所有同级 p<\/td><\/tr>\n<tr><td class=\"c\">[href]<\/td><td>带 href 属性的<\/td><\/tr>\n<tr><td class=\"c\">[href=\"a.html\"]<\/td><td>href 正好等于 a.html<\/td><\/tr>\n<tr><td class=\"c\">[href^=\"https\"]<\/td><td>href 以 https 开头<\/td><\/tr>\n<tr><td class=\"c\">[href$=\".pdf\"]<\/td><td>href 以 .pdf 结尾<\/td><\/tr>\n<tr><td class=\"c\">[href*=\"ume\"]<\/td><td>href 里含 ume<\/td><\/tr>\n<tr><td class=\"c\">a:hover<\/td><td>鼠标悬停时的 a<\/td><\/tr>\n<tr><td class=\"c\">a:active<\/td><td>正被按下的 a<\/td><\/tr>\n<tr><td class=\"c\">input:focus<\/td><td>获得焦点的输入框<\/td><\/tr>\n<tr><td class=\"c\">li:first-child<\/td><td>第一个 li<\/td><\/tr>\n<tr><td class=\"c\">li:last-child<\/td><td>最后一个 li<\/td><\/tr>\n<tr><td class=\"c\">tr:nth-child(2n)<\/td><td>偶数行<\/td><\/tr>\n<tr><td class=\"c\">li:not(.on)<\/td><td>不是 .on 的 li<\/td><\/tr>\n<tr><td class=\"c\">p::before<\/td><td>在 p 内容前插入<\/td><\/tr>\n<tr><td class=\"c\">p::after<\/td><td>在 p 内容后插入<\/td><\/tr>\n<tr><td class=\"c\">::selection<\/td><td>被选中的文字<\/td><\/tr>\n<\/tbody>\n<\/table>\n\n<div class=\"card key\">\n  <div class=\"card-t\">这一篇要记住的四句话<\/div>\n  <ol>\n    <li><b>日常九成时间用 <code>.class<\/code><\/b>；<code>#id<\/code> 留给唯一锚点。<\/li>\n    <li><b>空格是「后代」，<code>&gt;<\/code> 是「亲儿子」<\/b>，\n      <code>+<\/code>/<code>~<\/code> 是「兄弟」—— 别混。<\/li>\n    <li><b><code>[href^=\"https\"]<\/code> / <code>[href$=\".pdf\"]<\/code> 能按属性挑元素<\/b>，\n      做外链标记、文件类型图标非常好用。<\/li>\n    <li><b>优先级：越具体越赢；同样具体时后写的赢<\/b>。\n      与其堆选择器，不如把 class 起好名字。<\/li>\n  <\/ol>\n<\/div>","series":[{"file":"fe-01.html","num":"FE-01","title":"HTML 入门与标签语法","star":false},{"file":"fe-02.html","num":"FE-02","title":"HTML 常用标签","star":false},{"file":"fe-03-F01.html","num":"FE-03-F01","title":"十六进制颜色模型、HSV 与 Alpha","star":true},{"file":"fe-03.html","num":"FE-03","title":"CSS 入门","star":false},{"file":"fe-04.html","num":"FE-04","title":"CSS 选择器语法","star":false},{"file":"fe-05.html","num":"FE-05","title":"Display 与盒模型尺寸","star":false},{"file":"fe-06.html","num":"FE-06","title":"Writing Mode 与溢出滚动","star":true},{"file":"fe-07.html","num":"FE-07","title":"鼠标悬停与 transition","star":false},{"file":"fe-08.html","num":"FE-08","title":"JavaScript 语法初步","star":false},{"file":"fe-09.html","num":"FE-09","title":"DOM 操作基础","star":true}]};
