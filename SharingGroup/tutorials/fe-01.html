window.__FE_PAGE__ = {"file":"fe-01.html","num":"FE-01","title":"HTML 入门与标签语法","star":false,"body":"<p><span class=\"lang html\">HTML<\/span><\/p>\n\n<div class=\"card note\">\n  <div class=\"card-t\">这一篇讲什么<\/div>\n  <p>HTML 是<b>描述网页内容<\/b>的语言。它不负责好看（那是 CSS 的事），\n  只负责「<b>这里是一段话<\/b>」「<b>这里是一个列表<\/b>」「<b>这里是一张图<\/b>」。<\/p>\n  <p>前端系列从这里开始。<b>不需要任何编程基础。<\/b><\/p>\n<\/div>\n\n<h2 id=\"s1\"><span class=\"n\">1<\/span>HTML 是什么<\/h2>\n\n<p><b>HTML = HyperText Markup Language（超文本标记语言）<\/b>。\n它不是编程语言 —— 没有变量、没有循环、不会「运行」。\n它只是<b>给内容打标记<\/b>。<\/p>\n\n<table>\n<thead><tr><th style=\"width:26%\">它是什么<\/th><th>说明<\/th><\/tr><\/thead>\n<tbody>\n<tr><td><b>标记语言<\/b><\/td><td>用成对的标记（标签）把内容包起来，说明「这是什么」<\/td><\/tr>\n<tr><td><b>不是编程语言<\/b><\/td><td>没有逻辑、没有计算。<b>写什么就是什么<\/b><\/td><\/tr>\n<tr><td><b>浏览器负责渲染<\/b><\/td>\n    <td>你写的标签，浏览器按规则画成页面<\/td><\/tr>\n<\/tbody>\n<\/table>\n\n<div class=\"card key\">\n  <div class=\"card-t\">三件套的分工<\/div>\n  <table style=\"margin:8px 0 0\">\n  <thead><tr><th style=\"width:18%\"><\/th><th>管什么<\/th><th>类比<\/th><\/tr><\/thead>\n  <tbody>\n  <tr><td class=\"c\">HTML<\/td><td><b>内容<\/b>：有什么东西<\/td><td>房子的<b>结构<\/b>（墙、门、窗）<\/td><\/tr>\n  <tr><td class=\"c\">CSS<\/td><td><b>样式<\/b>：长什么样<\/td><td>房子的<b>装修<\/b>（颜色、地板）<\/td><\/tr>\n  <tr><td class=\"c\">JavaScript<\/td><td><b>行为<\/b>：能做什么<\/td><td>房子的<b>电器<\/b>（开关、电梯）<\/td><\/tr>\n  <\/tbody><\/table>\n  <p style=\"margin-top:10px\">本系列先讲 HTML 与 CSS。<b>UME.html 就是这三者合起来的产物。<\/b><\/p>\n<\/div>\n\n<h2 id=\"s2\"><span class=\"n\">2<\/span>所写即所得<\/h2>\n\n<p>HTML 最让人安心的一点：<b>你写什么，浏览器就显示什么。<\/b>\n把下面的内容存成 <code>test.html<\/code>，双击用浏览器打开：<\/p>\n\n<div class=\"code-wrap\"><div class=\"bar\"><span class=\"dot r\"><\/span><span class=\"dot y\"><\/span><span class=\"dot g\"><\/span><span class=\"name\">最小的网页<\/span><span class=\"cp\">复制<\/span><\/div><pre><span class=\"hl-p\">&lt;p&gt;<\/span>你好，这是第一段话。<span class=\"hl-p\">&lt;/p&gt;<\/span>\n<span class=\"hl-p\">&lt;p&gt;<\/span>这是第二段话。<span class=\"hl-p\">&lt;/p&gt;<\/span><\/pre><\/div>\n\n<div class=\"out-wrap\"><div class=\"cap\">浏览器里看到<\/div><pre>你好，这是第一段话。\n\n这是第二段话。<\/pre><\/div>\n\n<p>注意三件事：<\/p>\n<ul>\n  <li><code>&lt;p&gt;<\/code> 和 <code>&lt;/p&gt;<\/code> <b>自己不会显示出来<\/b> ——\n    它们只是标记，浏览器看了就收起来<\/li>\n  <li>两个 <code>&lt;p&gt;<\/code> 之间<b>自动多了一个空行<\/b> ——\n    因为 <code>p<\/code> 就是「段落」，段落之间天然有空隙<\/li>\n  <li>你<b>没有写任何 CSS<\/b>，浏览器用默认样式渲染 ——\n    黑字白底、宋体或雅黑<\/li>\n<\/ul>\n\n<div class=\"card tip\">\n  <div class=\"card-t\">为什么说「所写即所得」<\/div>\n  <p>因为它<b>没有编译步骤、不会报错<\/b>。你改一个字，刷新浏览器立刻能看到。<\/p>\n  <p>对比一下 C 语言：写完要编译，报错要查行号。\n  HTML 错了不报错 —— 它<b>只是默默不按你想的显示<\/b>。\n  这既方便（改得快），也麻烦（错了没提示，靠眼睛看）。<\/p>\n<\/div>\n\n<h2 id=\"s3\"><span class=\"n\">3<\/span>标签语法<\/h2>\n\n<p>一个标签长这样：<\/p>\n\n<div class=\"code-wrap\"><div class=\"bar\"><span class=\"dot r\"><\/span><span class=\"dot y\"><\/span><span class=\"dot g\"><\/span><span class=\"name\">标签的解剖<\/span><span class=\"cp\">复制<\/span><\/div><pre><span class=\"hl-p\">&lt;p<\/span> <span class=\"hl-f\">class<\/span>=<span class=\"hl-s\">\"intro\"<\/span><span class=\"hl-p\">&gt;<\/span>内容<span class=\"hl-p\">&lt;/p&gt;<\/span>\n<span class=\"arw\">└┬┘ └────┬─────┘ └┬┘      └─┬─┘<\/span>\n<span class=\"arw\"> │       │        │          │<\/span>\n<span class=\"arw\"> │       │        │          └─ 结束标签<\/span>\n<span class=\"arw\"> │       │        └─ 开始标签的尖括号闭合<\/span>\n<span class=\"arw\"> │       └─ 属性（名=值）<\/span>\n<span class=\"arw\"> └─ 标签名<\/span><\/pre><\/div>\n\n<table>\n<thead><tr><th style=\"width:22%\">部分<\/th><th>说明<\/th><\/tr><\/thead>\n<tbody>\n<tr><td class=\"c\">&lt;p&gt;<\/td><td><b>开始标签<\/b>（开标签）<\/td><\/tr>\n<tr><td class=\"c\">&lt;/p&gt;<\/td><td><b>结束标签<\/b>（闭标签）——\n  比开始标签多一个 <code>/<\/code><\/td><\/tr>\n<tr><td class=\"c\">class=\"intro\"<\/td>\n    <td><b>属性<\/b>，写在开始标签里。一个标签可以有多个属性，\n      用空格隔开<\/td><\/tr>\n<tr><td class=\"c\">内容<\/td><td>被包在中间的东西<\/td><\/tr>\n<\/tbody>\n<\/table>\n\n<h4>两种标签：成对的与自闭合的<\/h4>\n\n<div class=\"code-wrap\"><div class=\"bar\"><span class=\"dot r\"><\/span><span class=\"dot y\"><\/span><span class=\"dot g\"><\/span><span class=\"name\">对比<\/span><span class=\"cp\">复制<\/span><\/div><pre><span class=\"hl-c\">&lt;!-- 成对：有开始有结束，中间放内容 --&gt;<\/span>\n<span class=\"hl-p\">&lt;p&gt;<\/span>一段话<span class=\"hl-p\">&lt;/p&gt;<\/span>\n<span class=\"hl-p\">&lt;div&gt;<\/span>一个块<span class=\"hl-p\">&lt;/div&gt;<\/span>\n\n<span class=\"hl-c\">&lt;!-- 自闭合：没有内容，写一个就行 --&gt;<\/span>\n<span class=\"hl-p\">&lt;br&gt;<\/span>              <span class=\"hl-c\">&lt;!-- 换行 --&gt;<\/span>\n<span class=\"hl-p\">&lt;hr&gt;<\/span>              <span class=\"hl-c\">&lt;!-- 一条横线 --&gt;<\/span>\n<span class=\"hl-p\">&lt;img<\/span> <span class=\"hl-f\">src<\/span>=<span class=\"hl-s\">\"a.png\"<\/span><span class=\"hl-p\">&gt;<\/span>   <span class=\"hl-c\">&lt;!-- 图片 --&gt;<\/span><\/pre><\/div>\n\n<div class=\"card warn\">\n  <div class=\"card-t\">忘记闭合会怎样<\/div>\n  <p>浏览器<b>不报错<\/b>，它会自己猜 —— 通常把后面的内容全包进你这个标签里。\n  结果就是「样式突然影响了后面一大片」。<\/p>\n  <p><b>所以：成对标签一定要写完整。<\/b>\n  写开标签时顺手把闭标签也打上，回头再填内容。<\/p>\n<\/div>\n\n<h4>大小写？<\/h4>\n<p>HTML 标签<b>不区分大小写<\/b>，<code>&lt;P&gt;<\/code> 和 <code>&lt;p&gt;<\/code> 一样。\n但业界一律<b>写小写<\/b> —— 看起来整齐，也和 XHTML、框架的写法一致。<\/p>\n\n<h2 id=\"s4\"><span class=\"n\">4<\/span>注释语法<\/h2>\n\n<div class=\"code-wrap\"><div class=\"bar\"><span class=\"dot r\"><\/span><span class=\"dot y\"><\/span><span class=\"dot g\"><\/span><span class=\"name\">HTML 注释<\/span><span class=\"cp\">复制<\/span><\/div><pre><span class=\"hl-c\">&lt;!-- 这是一条注释，浏览器不会显示它 --&gt;<\/span>\n\n<span class=\"hl-p\">&lt;p&gt;<\/span>这段话会显示<span class=\"hl-p\">&lt;/p&gt;<\/span>\n<span class=\"hl-c\">&lt;!-- &lt;p&gt;这段话被注释掉了，不会显示&lt;/p&gt; --&gt;<\/span><\/pre><\/div>\n\n<table>\n<thead><tr><th style=\"width:30%\">写法<\/th><th>说明<\/th><\/tr><\/thead>\n<tbody>\n<tr><td class=\"c\">&lt;!-- 注释 --&gt;<\/td><td>HTML 注释，可跨多行<\/td><\/tr>\n<tr><td class=\"c\">不能嵌套<\/td>\n    <td><code>&lt;!-- a &lt;!-- b --&gt; c --&gt;<\/code> 是错的 ——\n      注释里不能再写注释<\/td><\/tr>\n<\/tbody>\n<\/table>\n\n<div class=\"card tip\">\n  <div class=\"card-t\">注释有什么用<\/div>\n  <ul>\n    <li><b>临时屏蔽<\/b>：不想显示某段，先注释掉，不用删<\/li>\n    <li><b>做标记<\/b>：<code>&lt;!-- 导航开始 --&gt;<\/code>，\n      长文件里方便定位<\/li>\n    <li><b>留说明<\/b>：为什么这里要这么写<\/li>\n  <\/ul>\n  <p><b>注意<\/b>：注释会随文件发给浏览者，右键「查看源代码」就能看到。\n  <b>别在注释里写密码或内部信息。<\/b><\/p>\n<\/div>\n\n<h4>对照：三种语言的注释<\/h4>\n<table>\n<thead><tr><th style=\"width:22%\">语言<\/th><th>写法<\/th><\/tr><\/thead>\n<tbody>\n<tr><td class=\"c\">HTML<\/td><td class=\"c\">&lt;!-- 注释 --&gt;<\/td><\/tr>\n<tr><td class=\"c\">CSS<\/td><td class=\"c\">/* 注释 */<\/td><\/tr>\n<tr><td class=\"c\">C / C++ / JS<\/td><td class=\"c\">// 单行　　/* 多行 */<\/td><\/tr>\n<\/tbody>\n<\/table>\n\n<h2 id=\"s5\"><span class=\"n\">5<\/span>空格无效性<\/h2>\n\n<p>这是新手最容易困惑的一点：<b>HTML 会把连续的空格、换行、Tab 全部压成一个空格。<\/b><\/p>\n\n<div class=\"code-wrap\"><div class=\"bar\"><span class=\"dot r\"><\/span><span class=\"dot y\"><\/span><span class=\"dot g\"><\/span><span class=\"name\">写了很多空格和换行<\/span><span class=\"cp\">复制<\/span><\/div><pre><span class=\"hl-p\">&lt;p&gt;<\/span>你好          世界<span class=\"hl-p\">&lt;/p&gt;<\/span>\n\n<span class=\"hl-p\">&lt;p&gt;<\/span>你好\n\n\n     世界<span class=\"hl-p\">&lt;/p&gt;<\/span><\/pre><\/div>\n\n<div class=\"out-wrap\"><div class=\"cap\">浏览器里看到的（两段完全一样）<\/div><pre>你好 世界\n\n你好 世界<\/pre><\/div>\n\n<div class=\"card key\">\n  <div class=\"card-t\">规则<\/div>\n  <p><b>连续空白 → 一个空格。<\/b>不管你在源码里敲了多少个空格或多少行。<\/p>\n  <p>所以你可以放心地<b>用换行和缩进把源码排整齐<\/b> ——\n  不会影响显示效果。这是好事：源码可读性全靠它。<\/p>\n<\/div>\n\n<h4>那想要多个空格怎么办<\/h4>\n<table>\n<thead><tr><th style=\"width:34%\">办法<\/th><th>说明<\/th><\/tr><\/thead>\n<tbody>\n<tr><td class=\"c\">&amp;nbsp;<\/td>\n    <td>「不换行空格」，写几个就是几个。\n      例：<code>a&amp;nbsp;&amp;nbsp;b<\/code> → a&nbsp;&nbsp;b<\/td><\/tr>\n<tr><td class=\"c\">&lt;br&gt;<\/td><td>换行<\/td><\/tr>\n<tr><td class=\"c\">&lt;pre&gt;...&lt;/pre&gt;<\/td>\n    <td><b>保留原始格式<\/b>，空格换行都照原样。代码块就用它<\/td><\/tr>\n<\/tbody>\n<\/table>\n\n<div class=\"code-wrap\"><div class=\"bar\"><span class=\"dot r\"><\/span><span class=\"dot y\"><\/span><span class=\"dot g\"><\/span><span class=\"name\">pre 保留格式<\/span><span class=\"cp\">复制<\/span><\/div><pre><span class=\"hl-p\">&lt;pre&gt;<\/span>\n  第一行\n      缩进了四个空格\n  第三行\n<span class=\"hl-p\">&lt;/pre&gt;<\/span><\/pre><\/div>\n\n<div class=\"out-wrap\"><div class=\"cap\">浏览器里看到<\/div><pre>  第一行\n      缩进了四个空格\n  第三行<\/pre><\/div>\n\n<h4>还有几个「打不出来」的符号<\/h4>\n<p>有些字符在 HTML 里有特殊含义，要用<b>实体（entity）<\/b>写：<\/p>\n\n<table>\n<thead><tr><th style=\"width:22%\">想显示<\/th><th style=\"width:24%\">要写<\/th><th>为什么<\/th><\/tr><\/thead>\n<tbody>\n<tr><td class=\"c\">&lt;<\/td><td class=\"c\">&amp;lt;<\/td><td><code>&lt;<\/code> 是标签的开始，直接写会被当成标签<\/td><\/tr>\n<tr><td class=\"c\">&gt;<\/td><td class=\"c\">&amp;gt;<\/td><td>同上<\/td><\/tr>\n<tr><td class=\"c\">&amp;<\/td><td class=\"c\">&amp;amp;<\/td><td><code>&amp;<\/code> 是实体的开始<\/td><\/tr>\n<tr><td class=\"c\">\"<\/td><td class=\"c\">&amp;quot;<\/td><td>属性值用引号包着时会冲突<\/td><\/tr>\n<tr><td class=\"c\">空格<\/td><td class=\"c\">&amp;nbsp;<\/td><td>上面讲过<\/td><\/tr>\n<\/tbody>\n<\/table>\n\n<p><code>lt<\/code> = <b>l<\/b>ess <b>t<\/b>han，<code>gt<\/code> = <b>g<\/b>reater <b>t<\/b>han，\n<code>amp<\/code> = <b>amp<\/b>ersand。<b>记住这三个就够用了。<\/b><\/p>\n\n<h2 id=\"s6\"><span class=\"n\">6<\/span>完整的骨架<\/h2>\n\n<p>前面都是片段。一个正式的 HTML 文件有固定骨架：<\/p>\n\n<div class=\"code-wrap\"><div class=\"bar\"><span class=\"dot r\"><\/span><span class=\"dot y\"><\/span><span class=\"dot g\"><\/span><span class=\"name\">完整骨架（建议背下来）<\/span><span class=\"cp\">复制<\/span><\/div><pre><span class=\"hl-p\">&lt;!DOCTYPE html&gt;<\/span>\n<span class=\"hl-p\">&lt;html<\/span> <span class=\"hl-f\">lang<\/span>=<span class=\"hl-s\">\"zh-CN\"<\/span><span class=\"hl-p\">&gt;<\/span>\n<span class=\"hl-p\">&lt;head&gt;<\/span>\n  <span class=\"hl-p\">&lt;meta<\/span> <span class=\"hl-f\">charset<\/span>=<span class=\"hl-s\">\"utf-8\"<\/span><span class=\"hl-p\">&gt;<\/span>\n  <span class=\"hl-p\">&lt;meta<\/span> <span class=\"hl-f\">name<\/span>=<span class=\"hl-s\">\"viewport\"<\/span> <span class=\"hl-f\">content<\/span>=<span class=\"hl-s\">\"width=device-width, initial-scale=1\"<\/span><span class=\"hl-p\">&gt;<\/span>\n  <span class=\"hl-p\">&lt;title&gt;<\/span>页面标题<span class=\"hl-p\">&lt;/title&gt;<\/span>\n<span class=\"hl-p\">&lt;/head&gt;<\/span>\n<span class=\"hl-p\">&lt;body&gt;<\/span>\n  <span class=\"hl-p\">&lt;p&gt;<\/span>这里才是给用户看的内容<span class=\"hl-p\">&lt;/p&gt;<\/span>\n<span class=\"hl-p\">&lt;/body&gt;<\/span>\n<span class=\"hl-p\">&lt;/html&gt;<\/span><\/pre><\/div>\n\n<table>\n<thead><tr><th style=\"width:26%\">部分<\/th><th>作用<\/th><\/tr><\/thead>\n<tbody>\n<tr><td class=\"c\">&lt;!DOCTYPE html&gt;<\/td>\n    <td>第一行，声明「这是 HTML5」。<b>不写会让浏览器进入怪异模式<\/b><\/td><\/tr>\n<tr><td class=\"c\">&lt;html lang=\"zh-CN\"&gt;<\/td>\n    <td>整份文档的根。<code>lang<\/code> 说明语言，影响断词和朗读<\/td><\/tr>\n<tr><td class=\"c\">&lt;head&gt;<\/td>\n    <td><b>给浏览器看的信息<\/b>，不在页面上显示<\/td><\/tr>\n<tr><td class=\"c\">charset=\"utf-8\"<\/td>\n    <td><b>必须写<\/b>，否则中文会乱码<\/td><\/tr>\n<tr><td class=\"c\">viewport<\/td>\n    <td><b>手机上必须写<\/b>，否则页面被缩得很小<\/td><\/tr>\n<tr><td class=\"c\">&lt;title&gt;<\/td>\n    <td>浏览器标签页上的文字<\/td><\/tr>\n<tr><td class=\"c\">&lt;body&gt;<\/td>\n    <td><b>用户能看到的内容<\/b>全在这里<\/td><\/tr>\n<\/tbody>\n<\/table>\n\n<div class=\"card key\">\n  <div class=\"card-t\">head 与 body 的分工<\/div>\n  <p><b>head = 给机器看的<\/b>：编码、标题、样式表、脚本。<\/p>\n  <p><b>body = 给人看的<\/b>：文字、图片、表格、按钮。<\/p>\n  <p>写在 head 里的 <code>&lt;p&gt;<\/code> <b>不会被显示<\/b> ——\n  这是新手常见的「我写了怎么不出现」。<\/p>\n<\/div>\n\n<div class=\"card warn\">\n  <div class=\"card-t\">那两句 meta 千万别省<\/div>\n  <p><b><code>charset=\"utf-8\"<\/code><\/b>：不写，中文可能变成\n  <code>ä½ å¥½<\/code> 这种乱码。<\/p>\n  <p><b><code>viewport<\/code><\/b>：不写，手机浏览器会假装自己有 980px 宽，\n  把整个页面缩小塞进屏幕 —— 字小到看不清。\n  这就是本系列文档为什么在手机上也能正常看的原因。<\/p>\n<\/div>\n\n<h2 id=\"s7\"><span class=\"n\">7<\/span>常见错误<\/h2>\n\n<h4>错误 1 · 标签没闭合<\/h4>\n<div class=\"code-wrap\"><div class=\"bar\"><span class=\"dot r\"><\/span><span class=\"dot y\"><\/span><span class=\"dot g\"><\/span><span class=\"name\">对比<\/span><span class=\"cp\">复制<\/span><\/div><pre><span class=\"hl-p\">&lt;p&gt;<\/span>第一段\n<span class=\"hl-p\">&lt;p&gt;<\/span>第二段<span class=\"hl-p\">&lt;/p&gt;<\/span>     <span class=\"hl-c\">&lt;!-- 第一个 p 没关，第二段被吞进去了 --&gt;<\/span>\n\n<span class=\"hl-p\">&lt;p&gt;<\/span>第一段<span class=\"hl-p\">&lt;/p&gt;<\/span>       <span class=\"hl-c\">&lt;!-- ✅ --&gt;<\/span>\n<span class=\"hl-p\">&lt;p&gt;<\/span>第二段<span class=\"hl-p\">&lt;/p&gt;<\/span><\/pre><\/div>\n\n<h4>错误 2 · 中文乱码<\/h4>\n<div class=\"code-wrap\"><div class=\"bar\"><span class=\"dot r\"><\/span><span class=\"dot y\"><\/span><span class=\"dot g\"><\/span><span class=\"name\">对比<\/span><span class=\"cp\">复制<\/span><\/div><pre><span class=\"hl-p\">&lt;head&gt;<\/span>\n  <span class=\"hl-p\">&lt;title&gt;<\/span>中文<span class=\"hl-p\">&lt;/title&gt;<\/span>          <span class=\"hl-c\">&lt;!-- ❌ 没声明编码，可能乱码 --&gt;<\/span>\n<span class=\"hl-p\">&lt;/head&gt;<\/span>\n\n<span class=\"hl-p\">&lt;head&gt;<\/span>\n  <span class=\"hl-p\">&lt;meta<\/span> <span class=\"hl-f\">charset<\/span>=<span class=\"hl-s\">\"utf-8\"<\/span><span class=\"hl-p\">&gt;<\/span>  <span class=\"hl-c\">&lt;!-- ✅ 放在 head 第一行 --&gt;<\/span>\n  <span class=\"hl-p\">&lt;title&gt;<\/span>中文<span class=\"hl-p\">&lt;/title&gt;<\/span>\n<span class=\"hl-p\">&lt;/head&gt;<\/span><\/pre><\/div>\n\n<h4>错误 3 · 直接写 <code>&lt;<\/code> 和 <code>&amp;<\/code><\/h4>\n<div class=\"code-wrap\"><div class=\"bar\"><span class=\"dot r\"><\/span><span class=\"dot y\"><\/span><span class=\"dot g\"><\/span><span class=\"name\">对比<\/span><span class=\"cp\">复制<\/span><\/div><pre><span class=\"hl-p\">&lt;p&gt;<\/span>当 a &lt; b 时<span class=\"hl-p\">&lt;/p&gt;<\/span>      <span class=\"hl-c\">&lt;!-- ❌ 浏览器把 &lt;b 当成标签了 --&gt;<\/span>\n\n<span class=\"hl-p\">&lt;p&gt;<\/span>当 a &amp;lt; b 时<span class=\"hl-p\">&lt;/p&gt;<\/span>   <span class=\"hl-c\">&lt;!-- ✅ --&gt;<\/span><\/pre><\/div>\n\n<h4>错误 4 · 属性值没加引号<\/h4>\n<div class=\"code-wrap\"><div class=\"bar\"><span class=\"dot r\"><\/span><span class=\"dot y\"><\/span><span class=\"dot g\"><\/span><span class=\"name\">对比<\/span><span class=\"cp\">复制<\/span><\/div><pre><span class=\"hl-p\">&lt;a<\/span> <span class=\"hl-f\">href<\/span>=<span class=\"hl-s\">index.html<\/span><span class=\"hl-p\">&gt;<\/span>首页<span class=\"hl-p\">&lt;/a&gt;<\/span>       <span class=\"hl-c\">&lt;!-- ⚠ 能跑，但别这么写 --&gt;<\/span>\n\n<span class=\"hl-p\">&lt;a<\/span> <span class=\"hl-f\">href<\/span>=<span class=\"hl-s\">\"index.html\"<\/span><span class=\"hl-p\">&gt;<\/span>首页<span class=\"hl-p\">&lt;/a&gt;<\/span>     <span class=\"hl-c\">&lt;!-- ✅ 一律加引号 --&gt;<\/span><\/pre><\/div>\n<p>值里<b>有空格时<\/b>不加引号必错。养成习惯：<b>属性值一律用双引号。<\/b><\/p>\n\n<h4>错误 5 · 内容写在 head 里<\/h4>\n<div class=\"code-wrap\"><div class=\"bar\"><span class=\"dot r\"><\/span><span class=\"dot y\"><\/span><span class=\"dot g\"><\/span><span class=\"name\">对比<\/span><span class=\"cp\">复制<\/span><\/div><pre><span class=\"hl-p\">&lt;head&gt;<\/span>\n  <span class=\"hl-p\">&lt;p&gt;<\/span>你好<span class=\"hl-p\">&lt;/p&gt;<\/span>            <span class=\"hl-c\">&lt;!-- ❌ head 里的内容不显示 --&gt;<\/span>\n<span class=\"hl-p\">&lt;/head&gt;<\/span>\n\n<span class=\"hl-p\">&lt;body&gt;<\/span>\n  <span class=\"hl-p\">&lt;p&gt;<\/span>你好<span class=\"hl-p\">&lt;/p&gt;<\/span>            <span class=\"hl-c\">&lt;!-- ✅ --&gt;<\/span>\n<span class=\"hl-p\">&lt;/body&gt;<\/span><\/pre><\/div>\n\n<div class=\"card key\">\n  <div class=\"card-t\">这一篇要记住的五句话<\/div>\n  <ol>\n    <li><b>HTML 是标记语言，不是编程语言<\/b> —— 写什么就显示什么，\n      不报错。<\/li>\n    <li><b>标签成对出现<\/b>：<code>&lt;p&gt;<\/code> 内容 <code>&lt;/p&gt;<\/code>；\n      自闭合的写一个就行（<code>&lt;br&gt;<\/code>）。<\/li>\n    <li><b>注释是 <code>&lt;!-- --&gt;<\/code><\/b>，不能嵌套，\n      而且浏览者能看到，别写敏感信息。<\/li>\n    <li><b>连续空白会被压成一个空格<\/b> ——\n      所以可以放心缩进排版；要多空格用 <code>&amp;nbsp;<\/code>，\n      要保留格式用 <code>&lt;pre&gt;<\/code>。<\/li>\n    <li><b>骨架四件套别省<\/b>：<code>&lt;!DOCTYPE html&gt;<\/code>、\n      <code>charset=\"utf-8\"<\/code>、<code>viewport<\/code>、<code>&lt;body&gt;<\/code>。<\/li>\n  <\/ol>\n<\/div>","series":[{"file":"fe-01.html","num":"FE-01","title":"HTML 入门与标签语法","star":false},{"file":"fe-02.html","num":"FE-02","title":"HTML 常用标签","star":false},{"file":"fe-03-F01.html","num":"FE-03-F01","title":"十六进制颜色模型、HSV 与 Alpha","star":true},{"file":"fe-03.html","num":"FE-03","title":"CSS 入门","star":false},{"file":"fe-04.html","num":"FE-04","title":"CSS 选择器语法","star":true},{"file":"fe-05.html","num":"FE-05","title":"Display 与盒模型尺寸","star":false},{"file":"fe-06.html","num":"FE-06","title":"Writing Mode 与溢出滚动","star":true},{"file":"fe-07.html","num":"FE-07","title":"鼠标悬停与 transition","star":false}]};
