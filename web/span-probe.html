<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<title>浏览器里跨 span 的蒙文还连不连</title>
<style>
  @font-face{
    font-family:"NotoMongol";
    src:url("../font/NotoSansMongolian-Regular.ttf") format("truetype");
  }
  body{margin:0;padding:20px;background:#fff;
       font:13px/1.6 "Microsoft YaHei",sans-serif;color:#111}
  .box{margin:0 0 6px;padding:6px 10px;border:1px solid #dde3ee;border-radius:8px;
       display:inline-block;background:#fafcff}
  .txt{font-family:"NotoMongol",serif;font-size:64px;line-height:1.35;
       white-space:nowrap;color:#111}
  .row{margin:0 0 14px}
  .lbl{font:12px Consolas,monospace;color:#667}
  .big{font-size:96px}
  .red{color:#c00}
  .hi{background:#ffe9a8}
  .split{display:inline-block}
  h3{font-size:13px;margin:18px 0 8px;color:#445}
</style></head>
<body>
<h3>同一串 ᠮᠣᠩᠭᠣᠯ（6 码位），四种切法</h3>

<div class="row"><div class="lbl">A 整串纯文本</div>
  <div class="box"><span class="txt" id="a">ᠮᠣᠩᠭᠣᠯ</span></div></div>

<div class="row"><div class="lbl">B 中间一个字套 span 改字号 96px（整形属性）</div>
  <div class="box"><span class="txt" id="b">ᠮᠣᠩ<span class="big">ᠭ</span>ᠣᠯ</span></div></div>

<div class="row"><div class="lbl">C 中间一个字套 span 只改颜色（绘制属性）</div>
  <div class="box"><span class="txt" id="c">ᠮᠣᠩ<span class="red">ᠭ</span>ᠣᠯ</span></div></div>

<div class="row"><div class="lbl">D 中间一个字套 span 只加背景（绘制属性）</div>
  <div class="box"><span class="txt" id="d">ᠮᠣᠩ<span class="hi">ᠭ</span>ᠣᠯ</span></div></div>

<div class="row"><div class="lbl">E 强行切成三个 inline-block（等于硬切 run）</div>
  <div class="box"><span class="txt" id="e"><span class="split">ᠮᠣᠩ</span><span class="split">ᠭ</span><span class="split">ᠣᠯ</span></span></div></div>

<div class="row"><div class="lbl">F 单字 ᠭ 单独放（对照：孤立形）</div>
  <div class="box"><span class="txt" id="f">ᠭ</span></div></div>


<div class=row><div class=lbl>G 中间一个字 font-weight:bold（合成粗体）</div>
  <div class=box><span class=txt id=g>ᠮᠣᠩ<span style=font-weight:700>ᠭ</span>ᠣᠯ</span></div></div>

<div class=row><div class=lbl>H 中间一个字换字体族（另一个字体）</div>
  <div class=box><span class=txt id=h>ᠮᠣᠩ<span style=font-family:serif>ᠭ</span>ᠣᠯ</span></div></div>

<div class=row><div class=lbl>I 中间一个字 opacity:.6（纯绘制属性）</div>
  <div class=box><span class=txt id=i>ᠮᠣᠩ<span style=opacity:.6>ᠭ</span>ᠣᠯ</span></div></div>

<script>
window.__measure__ = function () {
  const out = {};
  const ids = ['a','b','c','d','e','f','g','h','i'];
  for (const id of ids) {
    const el = document.getElementById(id);
    const r = document.createRange();
    r.selectNodeContents(el);
    const box = r.getBoundingClientRect();
    out[id] = {
      width: Math.round(box.width * 100) / 100,
      height: Math.round(box.height * 100) / 100
    };
  }
  // 逐码位量一遍 A 的前进位置，看浏览器给的进度是小数还是整数
  const a = document.getElementById('a');
  const node = a.firstChild;
  const pos = [];
  const r = document.createRange();
  for (let i = 0; i <= node.length; i++) {
    r.setStart(node, 0); r.setEnd(node, i);
    pos.push(Math.round(r.getBoundingClientRect().width * 100) / 100);
  }
  out.perUnit = pos;
  out.ua = navigator.userAgent;
  return out;
};
</script>
</body></html>
